name: Publish 3B.2b routing beta6

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-3b2b-routing-beta6.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol dependencies
        run: python -m pip install pycryptodomex==3.23.0 reolink-aio==0.21.8
      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery
      - name: Run recording tests
        run: python -m unittest tests.test_recording_probe tests.test_recording_download_probe -v
      - name: Validate JSON
        run: python -m json.tool custom_components/reolink_battery/manifest.json >/dev/null && python -m json.tool custom_components/reolink_battery/strings.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/en.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/he.json >/dev/null
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-beta.6 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.2-beta.6 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.2-beta.6" \
            --notes "Milestone 3B.2b controlled cmd13 routing probe. Keeps the beta.5 FileInfoList XML, binary Extension, AES body and 0x6482 message class unchanged, but changes bytes 12-15 to the pinned reolink-aio layout already proven by cmd14/cmd15/cmd16 on the Argus 2E: header channel 7 plus a 24-bit message ID. Captures only the matching first response metadata and closes immediately. No cmd8 full media download, automatic worker, queue removal, or Telegram."
