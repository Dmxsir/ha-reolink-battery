name: Finalize clean v1.2.0 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v1.2.0-clean.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Remove temporary release workflows and retag stable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force origin

          rm -f .github/workflows/promote-v1.2.0.yml
          rm -f .github/workflows/finalize-v1.2.0-clean.yml
          git add -A .github/workflows
          git commit -m 'chore: remove temporary v1.2.0 release workflows'
          git push origin main

          # Point the already-published stable release tag at the final clean
          # release commit. The diagnostic beta45 tag is intentionally untouched.
          git tag -f v1.2.0 HEAD
          git push --force origin refs/tags/v1.2.0
