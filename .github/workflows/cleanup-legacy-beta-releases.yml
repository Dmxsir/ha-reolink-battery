name: Cleanup legacy beta releases

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-beta-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all legacy beta releases and tags except retained three
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          keep_tag() {
            case "$1" in
              v0.1.2-beta.43|v0.1.2-beta.44|v0.1.2-beta.45) return 0 ;;
              *) return 1 ;;
            esac
          }

          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id tag; do
            [[ "$tag" == *-beta.* ]] || continue
            keep_tag "$tag" && continue
            echo "Deleting beta release $tag ($release_id)"
            gh api --method DELETE "repos/$REPO/releases/$release_id"
          done

          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' |
          while IFS= read -r tag; do
            [[ "$tag" == *-beta.* ]] || continue
            keep_tag "$tag" && continue
            echo "Deleting beta tag $tag"
            gh api --method DELETE "repos/$REPO/git/refs/tags/$tag"
          done

          echo 'Retained beta tags only:'
          printf '%s\n' v0.1.2-beta.43 v0.1.2-beta.44 v0.1.2-beta.45
