name: Publish 3B.2b recordType beta13

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-3b2b-recordtype-beta13.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol dependencies
        run: python -m pip install pycryptodomex==3.23.0 reolink-aio==0.21.8
      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery
      - name: Run recording tests
        run: python -m unittest tests.test_recording_probe tests.test_recording_download_probe tests.test_recording_download_beta12 tests.test_recording_download_beta13 -v
      - name: Validate JSON
        run: python -m json.tool custom_components/reolink_battery/manifest.json >/dev/null && python -m json.tool custom_components/reolink_battery/strings.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/en.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/he.json >/dev/null
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-beta.13 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.2-beta.13 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.2-beta.13" \
            --notes "Milestone 3B.2b controlled cmd13 recordType probe. Keeps beta.12 FileInfo identity, streamType, fileType, 0x6482 framing, header channel 7, stream header 0, msgNum16, AES handling, binary Extension, logical XML channel 0 and FileInfo search unchanged. Adds only the camera-returned recordType field to cmd13 FileInfo (observed on this Argus as io, md). startTime/endTime are intentionally still omitted. No cmd8 media transfer, automatic worker, queue removal, or Telegram."
