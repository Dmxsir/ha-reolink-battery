name: Publish beta.28 controlled FileInfo retry

on:
  push:
    branches:
      - feature/recording-worker-3b2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply beta.28 source changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          probe_path = Path("custom_components/reolink_battery/recording_probe.py")
          probe = probe_path.read_text()
          old = '''            open_response = await host.baichuan.send(\n                cmd_id=14,\n                body=open_xml,\n                ch_id=FILE_INFO_HEADER_CHANNEL_ID,\n            )'''
          new = '''            open_response = await host.baichuan.send(\n                cmd_id=14,\n                body=open_xml,\n                ch_id=FILE_INFO_HEADER_CHANNEL_ID,\n                retry=1,\n            )'''
          assert old in probe, "expected beta.27 cmd14 block not found"
          probe = probe.replace(old, new, 1)
          probe_path.write_text(probe)

          manifest_path = Path("custom_components/reolink_battery/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          assert manifest["version"] == "0.1.2-beta.27"
          manifest["version"] = "0.1.2-beta.28"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Verify beta.28 source
        run: |
          python -m compileall -q custom_components/reolink_battery
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/reolink_battery/manifest.json").read_text())
          assert manifest["version"] == "0.1.2-beta.28"

          probe = Path("custom_components/reolink_battery/recording_probe.py").read_text()
          cmd14 = '''open_response = await host.baichuan.send(\n                cmd_id=14,\n                body=open_xml,\n                ch_id=FILE_INFO_HEADER_CHANNEL_ID,\n                retry=1,\n            )'''
          assert cmd14 in probe
          assert "FILE_INFO_OPEN_RETRY_DELAYS_SECONDS = (1.5, 2.5)" in probe
          assert "not getattr(connection, \"connection_open\", False)" in probe
          PY

      - name: Commit beta.28 source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/recording_probe.py custom_components/reolink_battery/manifest.json
          git commit -m "Control cmd14 retries for beta.28"
          git push origin HEAD:feature/recording-worker-3b2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.2-beta.28
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --prerelease \
            --title "$TAG" \
            --notes "Milestone 3B.5 controlled FileInfo retry follow-up. cmd14 now disables reolink-aio's internal retry/re-login path with retry=1. The integration keeps ownership of the existing 1.5s/2.5s same-session retries and retries only while the authenticated Baichuan connection remains open. If the session closes, the attempt ends immediately so the recording worker's existing camera-closed 30s/60s outer retry cadence opens a fresh session later instead of hitting reolink-aio's 15-second login guard. Queue deferral, 60-second settle, full-high handle-bound cmd8 download, verified atomic MP4 persistence under Home Assistant Media, and event-only media handoff are unchanged."
