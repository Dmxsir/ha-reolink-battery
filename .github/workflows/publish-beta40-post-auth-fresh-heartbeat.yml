name: Publish beta.40 post-auth fresh heartbeat TID

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta40-post-auth-fresh-heartbeat.yml
      - scripts/beta40_patch.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/recording-worker-3b2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'reolink-aio==0.21.8' 'pycryptodomex==3.23.0'

      - name: Patch beta.40 source
        run: |
          set -euo pipefail
          BETA21_BEFORE="$(sha256sum custom_components/reolink_battery/recording_download_probe_beta21.py | awk '{print $1}')"
          WORKER_BEFORE="$(sha256sum custom_components/reolink_battery/recording_worker.py | awk '{print $1}')"
          python scripts/beta40_patch.py
          test "$BETA21_BEFORE" = "$(sha256sum custom_components/reolink_battery/recording_download_probe_beta21.py | awk '{print $1}')"
          test "$WORKER_BEFORE" = "$(sha256sum custom_components/reolink_battery/recording_worker.py | awk '{print $1}')"

      - name: Verify beta.40 source
        run: |
          set -euo pipefail
          grep -q '"version": "0.1.2-beta.40"' custom_components/reolink_battery/manifest.json
          grep -q '3B.14-post-auth-fresh-heartbeat-tid' custom_components/reolink_battery/diagnostics.py
          grep -q 'activate_fresh_heartbeat_tids_after_login' custom_components/reolink_battery/recording_download_probe.py
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_download_beta40.py
          python tests/test_recording_download_beta39.py
          python tests/test_recording_download_beta38.py
          python tests/test_recording_download_beta37.py
          python tests/test_recording_download_beta35.py
          python tests/test_recording_download_beta34.py
          python tests/test_recording_download_beta32.py
          python tests/test_recording_download_beta20.py
          python tests/test_recording_download_probe.py
          git diff --check

      - name: Commit beta.40 source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/reolink_battery/recording_download_probe.py \
                  custom_components/reolink_battery/recording_download_probe_beta20.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  tests/test_recording_download_beta40.py
          git commit -m 'Activate fresh heartbeat IDs only after auth for beta.40'
          git push origin HEAD:feature/recording-worker-3b2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish beta.40 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git tag v0.1.2-beta.40 "$SOURCE_SHA"
          git push origin v0.1.2-beta.40
          gh release create v0.1.2-beta.40 \
            --repo Dmxsir/ha-reolink-battery \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title 'v0.1.2-beta.40' \
            --notes 'Milestone 3B.14 isolates the beta.39 authentication regression from the 60-second heartbeat-lifetime experiment. During wake/login, C2D_HB preserves beta.38 behavior by reusing the adopted handoff transaction ID. Only after Baichuan login succeeds does the connection switch to beta.39 fresh transaction IDs for each 1-second heartbeat. Beta.38 periodic-only inclusive-highest RX ACK behavior, single lease, cmd13/cmd8 reliable sender, full-high/mainStream routing, worker retries, exact MP4 verification and Media/Telegram handoff remain unchanged. Diagnostics expose whether fresh IDs were activated after login and how many pre-auth heartbeats reused the handoff TID. No cmd234 or cmd9 is introduced.'

      - name: Remove temporary beta.40 files
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-beta40-post-auth-fresh-heartbeat.yml scripts/beta40_patch.py
          git commit -m 'Remove temporary beta40 publish files'
          git push origin HEAD:feature/recording-worker-3b2
