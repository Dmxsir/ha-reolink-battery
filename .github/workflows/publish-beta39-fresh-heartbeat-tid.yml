name: Publish beta.39 fresh heartbeat TID

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta39-fresh-heartbeat-tid.yml
      - scripts/beta39_patch.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/recording-worker-3b2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'reolink-aio==0.21.8' 'pycryptodomex==3.23.0'

      - name: Patch beta.39 source
        run: |
          set -euo pipefail
          BETA21_BEFORE="$(sha256sum custom_components/reolink_battery/recording_download_probe_beta21.py | awk '{print $1}')"
          WORKER_BEFORE="$(sha256sum custom_components/reolink_battery/recording_worker.py | awk '{print $1}')"
          python scripts/beta39_patch.py
          test "$BETA21_BEFORE" = "$(sha256sum custom_components/reolink_battery/recording_download_probe_beta21.py | awk '{print $1}')"
          test "$WORKER_BEFORE" = "$(sha256sum custom_components/reolink_battery/recording_worker.py | awk '{print $1}')"

      - name: Verify beta.39 source
        run: |
          set -euo pipefail
          grep -q '"version": "0.1.2-beta.39"' custom_components/reolink_battery/manifest.json
          grep -q '3B.13-fresh-p2p-heartbeat-tid' custom_components/reolink_battery/diagnostics.py
          grep -q 'p2p_heartbeat_unique_tid_count' custom_components/reolink_battery/recording_download_probe_beta20.py
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_download_beta39.py
          python tests/test_recording_download_beta38.py
          python tests/test_recording_download_beta37.py
          python tests/test_recording_download_beta35.py
          python tests/test_recording_download_beta34.py
          python tests/test_recording_download_beta32.py
          python tests/test_recording_download_beta20.py
          python tests/test_recording_download_probe.py
          git diff --check

      - name: Commit beta.39 source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/reolink_battery/recording_download_probe_beta20.py custom_components/reolink_battery/diagnostics.py custom_components/reolink_battery/manifest.json tests/test_recording_download_beta39.py
          git commit -m 'Refresh P2P heartbeat transaction ID for beta.39'
          git push origin HEAD:feature/recording-worker-3b2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish beta.39 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git tag v0.1.2-beta.39 "$SOURCE_SHA"
          git push origin v0.1.2-beta.39
          gh release create v0.1.2-beta.39 --repo Dmxsir/ha-reolink-battery --target "$SOURCE_SHA" --prerelease --title 'v0.1.2-beta.39' --notes 'Milestone 3B.13 targets the near-exact 60-second D2C_DISC observed in beta.38. Beta.38 periodic-only inclusive-highest RX ACK behavior remains unchanged. Each 1-second P2P C2D_HB now uses a fresh transaction ID instead of replaying the original C2D_C transaction ID for the entire session, matching the independent Neolink heartbeat architecture. Single lease, cmd13/cmd8 reliable sender, full-high/mainStream routing, worker retries, exact MP4 verification and Media/Telegram handoff remain unchanged. Diagnostics expose fresh-TID mode and unique heartbeat transaction count. No cmd234 or cmd9 is introduced.'
