name: Apply Hebrew README RTL

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-hebrew-rtl.yml

permissions:
  contents: write

jobs:
  apply-rtl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply RTL to main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("README_HE.md")
          text = p.read_text(encoding="utf-8")

          if '<div dir="rtl" align="right">' not in text:
              text = '<div dir="rtl" align="right">\n\n' + text.rstrip() + '\n\n</div>\n'

          text = text.replace('<div align="center">', '<div align="center" dir="ltr">', 1)

          lines = text.splitlines()
          out = []
          in_code = False
          for line in lines:
              if line.startswith('```'):
                  if not in_code:
                      out.append('<div dir="ltr" align="left">')
                      out.append('')
                      out.append(line)
                      in_code = True
                  else:
                      out.append(line)
                      out.append('')
                      out.append('</div>')
                      in_code = False
              else:
                  out.append(line)
          p.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')
          PY

          git add README_HE.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: render Hebrew README right-to-left"
            git push origin main
          fi

      - name: Apply RTL to feature branch
        run: |
          git fetch origin feature/recording-worker-3b2
          git switch -C feature/recording-worker-3b2 origin/feature/recording-worker-3b2

          python3 - <<'PY'
          from pathlib import Path

          p = Path("README_HE.md")
          text = p.read_text(encoding="utf-8")

          if '<div dir="rtl" align="right">' not in text:
              text = '<div dir="rtl" align="right">\n\n' + text.rstrip() + '\n\n</div>\n'

          text = text.replace('<div align="center">', '<div align="center" dir="ltr">', 1)

          lines = text.splitlines()
          out = []
          in_code = False
          for line in lines:
              if line.startswith('```'):
                  if not in_code:
                      out.append('<div dir="ltr" align="left">')
                      out.append('')
                      out.append(line)
                      in_code = True
                  else:
                      out.append(line)
                      out.append('')
                      out.append('</div>')
                      in_code = False
              else:
                  out.append(line)
          p.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')
          PY

          git add README_HE.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: render Hebrew README right-to-left"
            git push origin feature/recording-worker-3b2
          fi
