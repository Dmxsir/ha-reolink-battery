name: Resize Ko-fi banner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resize-kofi-banner.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resize banner on README branches
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for branch in main feature/recording-worker-3b2; do
            git checkout "$branch"
            git pull --ff-only origin "$branch"
            sed -i 's/alt="Buy me a coffee — support the project on Ko-fi" width="900"/alt="Buy me a coffee — support the project on Ko-fi" width="450"/' README.md
            if ! git diff --quiet -- README.md; then
              git add README.md
              git commit -m 'docs: reduce Ko-fi banner size by 50 percent'
              git push origin "$branch"
            fi
          done
