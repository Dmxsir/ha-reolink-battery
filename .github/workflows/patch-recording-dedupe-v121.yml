name: Patch recording dedupe v1.2.1

on:
  push:
    branches:
      - fix/recording-dedupe-1.2.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recording-dedupe-1.2.1
          fetch-depth: 0

      - name: Apply persistent recording dedupe patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # ---- constants -------------------------------------------------
          replace_once(
              "custom_components/reolink_battery/const.py",
              "MAX_PROCESSED_EVENT_IDS = 512\nMAX_PENDING_EVENTS = 100\n",
              "MAX_PROCESSED_EVENT_IDS = 512\nMAX_PENDING_EVENTS = 100\nMAX_COMPLETED_RECORDINGS = 256\n",
          )

          # ---- persistent queue recording fingerprints ------------------
          events_path = Path("custom_components/reolink_battery/events.py")
          events = events_path.read_text()
          old_import = "from .const import MAX_PENDING_EVENTS, MAX_PROCESSED_EVENT_IDS, MEANINGFUL_ALARM_TYPES"
          new_import = "from .const import (\n    MAX_COMPLETED_RECORDINGS,\n    MAX_PENDING_EVENTS,\n    MAX_PROCESSED_EVENT_IDS,\n    MEANINGFUL_ALARM_TYPES,\n)"
          if events.count(old_import) != 1:
              raise SystemExit("events.py const import anchor mismatch")
          events = events.replace(old_import, new_import, 1)

          marker = "\n\ndef parse_alarm_time(value: object) -> datetime:\n"
          completed_class = '''\n\n@dataclass(frozen=True, slots=True)\nclass CompletedRecording:\n    \"\"\"Persistent secret-safe identity for one verified SD recording.\"\"\"\n\n    fingerprint: str\n    start_time: datetime\n    end_time: datetime\n    size: int\n\n    def as_storage(self) -> dict[str, object]:\n        return {\n            \"fingerprint\": self.fingerprint,\n            \"start_time\": self.start_time.isoformat(),\n            \"end_time\": self.end_time.isoformat(),\n            \"size\": self.size,\n        }\n\n    @classmethod\n    def from_storage(cls, data: dict[str, object]) -> \"CompletedRecording\":\n        return cls(\n            fingerprint=str(data[\"fingerprint\"]),\n            start_time=datetime.fromisoformat(str(data[\"start_time\"])),\n            end_time=datetime.fromisoformat(str(data[\"end_time\"])),\n            size=int(data.get(\"size\") or 0),\n        )\n'''
          if events.count(marker) != 1:
              raise SystemExit("events.py parse_alarm_time anchor mismatch")
          events = events.replace(marker, completed_class + marker, 1)

          old_init = '''    def __init__(self) -> None:\n        self._processed: list[str] = []\n        self._processed_set: set[str] = set()\n        self._pending: list[CloudEvent] = []\n'''
          new_init = '''    def __init__(self) -> None:\n        self._processed: list[str] = []\n        self._processed_set: set[str] = set()\n        self._pending: list[CloudEvent] = []\n        self._completed_recordings: list[CompletedRecording] = []\n'''
          if events.count(old_init) != 1:
              raise SystemExit("events.py EventQueue init anchor mismatch")
          events = events.replace(old_init, new_init, 1)

          old_props = '''    @property\n    def processed_count(self) -> int:\n        return len(self._processed)\n\n    def enqueue(self, event: CloudEvent) -> bool:\n'''
          new_props = '''    @property\n    def processed_count(self) -> int:\n        return len(self._processed)\n\n    @property\n    def completed_recording_fingerprints(self) -> frozenset[str]:\n        return frozenset(item.fingerprint for item in self._completed_recordings)\n\n    @property\n    def completed_recording_count(self) -> int:\n        return len(self._completed_recordings)\n\n    def remember_completed_recording(self, recording: CompletedRecording) -> bool:\n        if recording.fingerprint in self.completed_recording_fingerprints:\n            return False\n        self._completed_recordings.append(recording)\n        if len(self._completed_recordings) > MAX_COMPLETED_RECORDINGS:\n            self._completed_recordings = self._completed_recordings[-MAX_COMPLETED_RECORDINGS:]\n        return True\n\n    def enqueue(self, event: CloudEvent) -> bool:\n'''
          if events.count(old_props) != 1:
              raise SystemExit("events.py processed_count anchor mismatch")
          events = events.replace(old_props, new_props, 1)

          old_load_head = '''        processed = data.get(\"processed\")\n        pending = data.get(\"pending\")\n'''
          new_load_head = '''        processed = data.get(\"processed\")\n        pending = data.get(\"pending\")\n        completed_recordings = data.get(\"completed_recordings\")\n'''
          if events.count(old_load_head) != 1:
              raise SystemExit("events.py load head anchor mismatch")
          events = events.replace(old_load_head, new_load_head, 1)

          old_load_tail = '''            self._pending = restored\n            for event in restored:\n                if event.event_id not in self._processed_set:\n                    self._processed.append(event.event_id)\n                    self._processed_set.add(event.event_id)\n\n    def as_storage(self) -> dict[str, object]:\n        return {\n            \"processed\": self._processed[-MAX_PROCESSED_EVENT_IDS:],\n            \"pending\": [event.as_storage() for event in self._pending],\n        }\n'''
          new_load_tail = '''            self._pending = restored\n            for event in restored:\n                if event.event_id not in self._processed_set:\n                    self._processed.append(event.event_id)\n                    self._processed_set.add(event.event_id)\n        if isinstance(completed_recordings, list):\n            restored_recordings: list[CompletedRecording] = []\n            for item in completed_recordings[-MAX_COMPLETED_RECORDINGS:]:\n                if not isinstance(item, dict):\n                    continue\n                try:\n                    restored_recordings.append(CompletedRecording.from_storage(item))\n                except (KeyError, TypeError, ValueError):\n                    continue\n            self._completed_recordings = restored_recordings\n\n    def as_storage(self) -> dict[str, object]:\n        return {\n            \"processed\": self._processed[-MAX_PROCESSED_EVENT_IDS:],\n            \"pending\": [event.as_storage() for event in self._pending],\n            \"completed_recordings\": [\n                recording.as_storage()\n                for recording in self._completed_recordings[-MAX_COMPLETED_RECORDINGS:]\n            ],\n        }\n'''
          if events.count(old_load_tail) != 1:
              raise SystemExit("events.py load/as_storage anchor mismatch")
          events = events.replace(old_load_tail, new_load_tail, 1)
          events_path.write_text(events)

          # ---- deterministic recording fingerprint ----------------------
          probe_path = Path("custom_components/reolink_battery/recording_probe.py")
          probe = probe_path.read_text()
          if probe.count("import asyncio\n") != 1:
              raise SystemExit("recording_probe.py asyncio import anchor mismatch")
          probe = probe.replace("import asyncio\n", "import asyncio\nimport hashlib\n", 1)
          fingerprint_marker = '''def select_recording_candidate(\n    target_local: datetime,\n'''
          fingerprint_fn = '''def recording_fingerprint(uid: str, candidate: RecordingCandidate) -> str:\n    \"\"\"Return a stable non-reversible identity for one SD recording.\"\"\"\n    identity = (\n        candidate.record_id\n        or candidate.xml_file_name\n        or candidate.file_name\n        or candidate.display_name\n    )\n    canonical = \"\\x1f\".join(\n        (\n            uid,\n            candidate.start_time.isoformat(timespec=\"seconds\"),\n            candidate.end_time.isoformat(timespec=\"seconds\"),\n            str(int(candidate.size or 0)),\n            identity,\n        )\n    )\n    return hashlib.sha256(canonical.encode(\"utf-8\")).hexdigest()\n\n\n'''
          if probe.count(fingerprint_marker) != 1:
              raise SystemExit("recording_probe.py candidate selector anchor mismatch")
          probe = probe.replace(fingerprint_marker, fingerprint_fn + fingerprint_marker, 1)
          probe_path.write_text(probe)

          # ---- dedupe after FileInfo, before cmd13/cmd8 ------------------
          download_path = Path("custom_components/reolink_battery/recording_download_probe.py")
          download = download_path.read_text()
          old_probe_import = '''    RecordingCandidate,\n    _list_recordings_file_info,\n    select_recording_candidate,\n)\n'''
          new_probe_import = '''    RecordingCandidate,\n    _list_recordings_file_info,\n    recording_fingerprint,\n    select_recording_candidate,\n)\n'''
          if download.count(old_probe_import) != 1:
              raise SystemExit("recording_download_probe.py import anchor mismatch")
          download = download.replace(old_probe_import, new_probe_import, 1)

          error_marker = '''\n\n@dataclass(frozen=True, slots=True)\nclass Cmd13RequestMetadata:\n'''
          duplicate_error = '''\n\nclass RecordingAlreadyCompletedError(Exception):\n    \"\"\"The selected FileInfo recording was already completed earlier.\"\"\"\n\n    def __init__(\n        self,\n        fingerprint: str,\n        candidate_start: datetime,\n        candidate_end: datetime,\n        *,\n        file_info_trace: FileInfoTrace,\n        uid_resolve_trace: UidResolveTrace,\n    ) -> None:\n        super().__init__(\"recording already completed\")\n        self.fingerprint = fingerprint\n        self.candidate_start = candidate_start\n        self.candidate_end = candidate_end\n        self.file_info_trace = file_info_trace\n        self.uid_resolve_trace = uid_resolve_trace\n'''
          if download.count(error_marker) != 1:
              raise SystemExit("recording_download_probe.py error insertion anchor mismatch")
          download = download.replace(error_marker, duplicate_error + error_marker, 1)

          old_result_fields = '''    candidate_start: datetime\n    candidate_end: datetime\n    candidate_distance_seconds: float\n    request: Cmd13RequestMetadata\n'''
          new_result_fields = '''    candidate_start: datetime\n    candidate_end: datetime\n    candidate_distance_seconds: float\n    candidate_fingerprint: str\n    request: Cmd13RequestMetadata\n'''
          if download.count(old_result_fields) != 1:
              raise SystemExit("recording_download_probe.py result fields anchor mismatch")
          download = download.replace(old_result_fields, new_result_fields, 1)

          old_signature = '''    *,\n    resolve_timeout: float = UID_RESOLVE_TIMEOUT_SECONDS,\n    command_timeout: int = 30,\n) -> DownloadPrepareResult:\n'''
          new_signature = '''    *,\n    resolve_timeout: float = UID_RESOLVE_TIMEOUT_SECONDS,\n    command_timeout: int = 30,\n    completed_recording_fingerprints: frozenset[str] | None = None,\n) -> DownloadPrepareResult:\n'''
          if download.count(old_signature) != 1:
              raise SystemExit("recording_download_probe.py signature anchor mismatch")
          download = download.replace(old_signature, new_signature, 1)

          old_candidate_block = '''        candidate = select_recording_candidate(target_local, list(recordings))\n        if candidate is None:\n            raise DownloadPrepareError(\n                \"RECORDING_MATCH_ERROR\", file_info_trace=file_info_trace\n            )\n\n        failure_stage = \"DOWNLOAD_PREPARE_FRAME_ERROR\"\n        wire, request, identity_trace = _build_cmd13_wire(host.baichuan, uid, candidate)\n'''
          new_candidate_block = '''        candidate = select_recording_candidate(target_local, list(recordings))\n        if candidate is None:\n            raise DownloadPrepareError(\n                \"RECORDING_MATCH_ERROR\", file_info_trace=file_info_trace\n            )\n\n        candidate_fingerprint = recording_fingerprint(uid, candidate)\n        if (\n            completed_recording_fingerprints\n            and candidate_fingerprint in completed_recording_fingerprints\n        ):\n            raise RecordingAlreadyCompletedError(\n                candidate_fingerprint,\n                candidate.start_time,\n                candidate.end_time,\n                file_info_trace=file_info_trace,\n                uid_resolve_trace=uid_resolve_trace,\n            )\n\n        failure_stage = \"DOWNLOAD_PREPARE_FRAME_ERROR\"\n        wire, request, identity_trace = _build_cmd13_wire(host.baichuan, uid, candidate)\n'''
          if download.count(old_candidate_block) != 1:
              raise SystemExit("recording_download_probe.py candidate block anchor mismatch")
          download = download.replace(old_candidate_block, new_candidate_block, 1)

          old_result_return = '''            candidate_start=candidate.start_time,\n            candidate_end=candidate.end_time,\n            candidate_distance_seconds=candidate.distance_seconds,\n            request=request,\n'''
          new_result_return = '''            candidate_start=candidate.start_time,\n            candidate_end=candidate.end_time,\n            candidate_distance_seconds=candidate.distance_seconds,\n            candidate_fingerprint=candidate_fingerprint,\n            request=request,\n'''
          if download.count(old_result_return) != 1:
              raise SystemExit("recording_download_probe.py result return anchor mismatch")
          download = download.replace(old_result_return, new_result_return, 1)
          download_path.write_text(download)

          # ---- coordinator persistence ----------------------------------
          coordinator_path = Path("custom_components/reolink_battery/coordinator.py")
          coordinator = coordinator_path.read_text()
          old_events_import = "from .events import CloudEvent, EventQueue, parse_cloud_events"
          new_events_import = "from .events import CompletedRecording, CloudEvent, EventQueue, parse_cloud_events"
          if coordinator.count(old_events_import) != 1:
              raise SystemExit("coordinator.py events import anchor mismatch")
          coordinator = coordinator.replace(old_events_import, new_events_import, 1)

          old_coord_props = '''    @property\n    def processed_event_count(self) -> int:\n        return self._queue.processed_count\n\n    async def async_initialize(self) -> None:\n'''
          new_coord_props = '''    @property\n    def processed_event_count(self) -> int:\n        return self._queue.processed_count\n\n    @property\n    def completed_recording_fingerprints(self) -> frozenset[str]:\n        return self._queue.completed_recording_fingerprints\n\n    @property\n    def completed_recording_count(self) -> int:\n        return self._queue.completed_recording_count\n\n    async def async_initialize(self) -> None:\n'''
          if coordinator.count(old_coord_props) != 1:
              raise SystemExit("coordinator.py properties anchor mismatch")
          coordinator = coordinator.replace(old_coord_props, new_coord_props, 1)

          old_complete = '''    async def async_complete_event(self, event_id: str) -> bool:\n        \"\"\"Remove one pending item only after a verified recording is durable.\"\"\"\n        before = len(self._queue.pending)\n        self._queue.remove(event_id)\n        changed = len(self._queue.pending) != before\n        if changed:\n            await self._store.async_save(self._queue.as_storage())\n        return changed\n'''
          new_complete = '''    async def async_complete_event(\n        self,\n        event_id: str,\n        *,\n        completed_recording: CompletedRecording | None = None,\n    ) -> bool:\n        \"\"\"Complete an event and atomically remember its verified recording.\"\"\"\n        before = len(self._queue.pending)\n        self._queue.remove(event_id)\n        changed = len(self._queue.pending) != before\n        recording_added = (\n            self._queue.remember_completed_recording(completed_recording)\n            if completed_recording is not None\n            else False\n        )\n        if changed or recording_added:\n            await self._store.async_save(self._queue.as_storage())\n        return changed\n'''
          if coordinator.count(old_complete) != 1:
              raise SystemExit("coordinator.py complete_event anchor mismatch")
          coordinator = coordinator.replace(old_complete, new_complete, 1)
          coordinator_path.write_text(coordinator)

          # ---- worker behavior ------------------------------------------
          worker_path = Path("custom_components/reolink_battery/recording_worker.py")
          worker = worker_path.read_text()
          old_state = '''    attempts: int = 0\n    retries: int = 0\n    completed: int = 0\n    deferred_count: int = 0\n'''
          new_state = '''    attempts: int = 0\n    retries: int = 0\n    completed: int = 0\n    deduplicated_recordings: int = 0\n    last_duplicate_event_time: datetime | None = None\n    last_duplicate_recording_fingerprint_present: bool = False\n    deferred_count: int = 0\n'''
          if worker.count(old_state) != 1:
              raise SystemExit("recording_worker.py state anchor mismatch")
          worker = worker.replace(old_state, new_state, 1)

          old_lazy_import = '''        from .camera import CameraStageError\n        from .recording_download_beta22 import (\n'''
          new_lazy_import = '''        from .camera import CameraStageError\n        from .events import CompletedRecording\n        from .recording_download_probe import RecordingAlreadyCompletedError\n        from .recording_download_beta22 import (\n'''
          if worker.count(old_lazy_import) != 1:
              raise SystemExit("recording_worker.py lazy import anchor mismatch")
          worker = worker.replace(old_lazy_import, new_lazy_import, 1)

          old_reset = '''        self.state.last_file_saved = False\n        self.state.last_file_size = 0\n        self.state.last_ready_event_fired = False\n        self.state.last_uid_resolve_timeout_seconds = 0.0\n'''
          new_reset = '''        self.state.last_file_saved = False\n        self.state.last_file_size = 0\n        self.state.last_ready_event_fired = False\n        self.state.last_duplicate_recording_fingerprint_present = False\n        self.state.last_uid_resolve_timeout_seconds = 0.0\n'''
          if worker.count(old_reset) != 1:
              raise SystemExit("recording_worker.py reset anchor mismatch")
          worker = worker.replace(old_reset, new_reset, 1)

          old_call_tail = '''                    output_dir=str(output_dir),\n                    telemetry_owner=\"worker\",\n                    telemetry_event_time=event_time,\n                )\n        except CameraStageError as err:\n'''
          new_call_tail = '''                    output_dir=str(output_dir),\n                    telemetry_owner=\"worker\",\n                    telemetry_event_time=event_time,\n                    completed_recording_fingerprints=frozenset(\n                        self._entry.runtime_data.coordinator.completed_recording_fingerprints\n                    ),\n                )\n        except RecordingAlreadyCompletedError as err:\n            self._apply_uid_resolve_trace(err.uid_resolve_trace)\n            await self._entry.runtime_data.coordinator.async_complete_event(event.event_id)\n            self.state.deduplicated_recordings += 1\n            self.state.last_duplicate_event_time = event_time\n            self.state.last_duplicate_recording_fingerprint_present = bool(\n                err.fingerprint\n            )\n            self.state.last_failure_stage = \"\"\n            self.state.last_failure_type = \"\"\n            return True\n        except CameraStageError as err:\n'''
          if worker.count(old_call_tail) != 1:
              raise SystemExit("recording_worker.py download call anchor mismatch")
          worker = worker.replace(old_call_tail, new_call_tail, 1)

          old_complete_worker = '''        # Persistent queue completion happens only after disk verification.\n        await self._entry.runtime_data.coordinator.async_complete_event(event.event_id)\n        self.state.completed += 1\n'''
          new_complete_worker = '''        # Persist the recording fingerprint before publishing the ready event.\n        # A later notification that maps to this exact FileInfo recording is\n        # completed silently before cmd13/cmd8, preventing duplicate Telegram sends.\n        await self._entry.runtime_data.coordinator.async_complete_event(\n            event.event_id,\n            completed_recording=CompletedRecording(\n                fingerprint=result.candidate_fingerprint,\n                start_time=result.candidate_start,\n                end_time=result.candidate_end,\n                size=expected_size,\n            ),\n        )\n        self.state.completed += 1\n'''
          if worker.count(old_complete_worker) != 1:
              raise SystemExit("recording_worker.py completion anchor mismatch")
          worker = worker.replace(old_complete_worker, new_complete_worker, 1)
          worker_path.write_text(worker)

          # ---- diagnostics ----------------------------------------------
          diagnostics_path = Path("custom_components/reolink_battery/diagnostics.py")
          diagnostics = diagnostics_path.read_text()
          old_event_diag = '''            \"pending_count\": len(coordinator.pending_events),\n            \"processed_count\": coordinator.processed_event_count,\n            \"last_failure_stage\": coordinator.last_failure_stage or None,\n'''
          new_event_diag = '''            \"pending_count\": len(coordinator.pending_events),\n            \"processed_count\": coordinator.processed_event_count,\n            \"completed_recording_count\": coordinator.completed_recording_count,\n            \"last_failure_stage\": coordinator.last_failure_stage or None,\n'''
          if diagnostics.count(old_event_diag) != 1:
              raise SystemExit("diagnostics.py event count anchor mismatch")
          diagnostics = diagnostics.replace(old_event_diag, new_event_diag, 1)

          old_worker_diag = '''            \"attempts\": worker.state.attempts if worker else 0,\n            \"retries\": worker.state.retries if worker else 0,\n            \"completed\": worker.state.completed if worker else 0,\n            \"deferred_count\": worker.state.deferred_count if worker else 0,\n'''
          new_worker_diag = '''            \"attempts\": worker.state.attempts if worker else 0,\n            \"retries\": worker.state.retries if worker else 0,\n            \"completed\": worker.state.completed if worker else 0,\n            \"deduplicated_recordings\": (\n                worker.state.deduplicated_recordings if worker else 0\n            ),\n            \"recording_dedupe_policy\": \"persistent_candidate_fingerprint_before_cmd13\",\n            \"last_duplicate_event_time\": (\n                worker.state.last_duplicate_event_time.isoformat()\n                if worker and worker.state.last_duplicate_event_time else None\n            ),\n            \"last_duplicate_recording_fingerprint_present\": bool(\n                worker and worker.state.last_duplicate_recording_fingerprint_present\n            ),\n            \"deferred_count\": worker.state.deferred_count if worker else 0,\n'''
          if diagnostics.count(old_worker_diag) != 1:
              raise SystemExit("diagnostics.py worker count anchor mismatch")
          diagnostics = diagnostics.replace(old_worker_diag, new_worker_diag, 1)
          diagnostics = diagnostics.replace(
              '"milestone": "3B.19-cmd13-reported-size-collector"',
              '"milestone": "1.2.1-persistent-recording-dedupe"',
              1,
          )
          diagnostics_path.write_text(diagnostics)

          # ---- version ---------------------------------------------------
          manifest_path = Path("custom_components/reolink_battery/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "1.2.0":
              raise SystemExit(f"unexpected source version: {manifest.get('version')}")
          manifest["version"] = "1.2.1"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          # ---- README ----------------------------------------------------
          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old_en = '''The current stable release is **v1.2.0**. It is promoted directly from the\nvalidated **v0.1.2-beta.45** codebase with no protocol or transport behavior\nchanges. **v0.1.2-beta.45** is retained as a diagnostic reference release for\ndeeper troubleshooting if needed.\n'''
          new_en = '''The current stable release is **v1.2.1**. It keeps the validated\n**v0.1.2-beta.45 / v1.2.0 transport baseline unchanged** and adds persistent\nrecording-level deduplication. If multiple Android notifications map to the same\nSD-card recording, the already-completed recording fingerprint is detected after\nFileInfo lookup and before cmd13/cmd8, so only one\n`reolink_battery_recording_ready` event is published. **v0.1.2-beta.45** remains\navailable as the diagnostic transport reference.\n'''
          if readme.count(old_en) != 1:
              raise SystemExit("README English stable paragraph anchor mismatch")
          readme = readme.replace(old_en, new_en, 1)

          old_he = '''הגרסה היציבה הנוכחית היא **v1.2.0**. היא קודמה ישירות מבסיס הקוד המאומת של **v0.1.2-beta.45**, ללא שינוי בהתנהגות ה־protocol או ה־transport. גרסת **v0.1.2-beta.45** נשמרת כגרסת אבחון לצורך דיבאג מעמיק במידת הצורך.\n'''
          new_he = '''הגרסה היציבה הנוכחית היא **v1.2.1**. היא משאירה ללא שינוי את בסיס ה־transport המאומת של **v0.1.2-beta.45 / v1.2.0**, ומוסיפה מנגנון deduplication מתמשך ברמת ההקלטה. אם כמה התראות Android ממופות לאותה הקלטה בכרטיס ה־SD, האינטגרציה מזהה fingerprint של הקלטה שכבר הושלמה לאחר FileInfo ולפני cmd13/cmd8, ולכן נורה רק אירוע `reolink_battery_recording_ready` אחד. גרסת **v0.1.2-beta.45** נשמרת כרפרנס אבחוני ל־transport.\n'''
          if readme.count(old_he) != 1:
              raise SystemExit("README Hebrew stable paragraph anchor mismatch")
          readme = readme.replace(old_he, new_he, 1)
          readme_path.write_text(readme)

          # ---- changelog -------------------------------------------------
          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          old_changelog = '''## Current stable release\n\n### v1.2.0 — Stable\n'''
          new_changelog = '''## Current stable release\n\n### v1.2.1 — Recording deduplication\n- Prevents duplicate Home Assistant/Telegram delivery when multiple Android Reolink notifications map to the same physical SD-card clip.\n- Stores a bounded, persistent SHA-256 recording fingerprint derived from the camera UID plus FileInfo identity, start/end timestamps and size. Raw filenames/record IDs are not exposed in diagnostics.\n- Checks the persistent fingerprint set after FileInfo selection and before cmd13/cmd8, so duplicate events are completed silently without downloading the same MP4 again or firing a second `reolink_battery_recording_ready` event.\n- Adds secret-safe dedupe diagnostics (`completed_recording_count`, `deduplicated_recordings`, last duplicate presence/time and policy).\n- Keeps the v1.2.0 / beta45 transport, heartbeat, ACK, retry and verified-file behavior unchanged.\n- `v0.1.2-beta.45` remains unchanged as the diagnostic transport reference.\n\n### v1.2.0 — Stable\n'''
          if changelog.count(old_changelog) != 1:
              raise SystemExit("CHANGELOG stable anchor mismatch")
          changelog = changelog.replace(old_changelog, new_changelog, 1)
          changelog = changelog.replace(
              "- `v1.2.0` is the stable public release line.\n",
              "- `v1.2.1` is the stable public release line.\n",
              1,
          )
          changelog_path.write_text(changelog)

          # ---- regression guard -----------------------------------------
          test_path = Path("tests/test_recording_dedupe_v121.py")
          test_path.write_text('''\"\"\"Regression guards for v1.2.1 persistent recording dedupe.\"\"\"\n\nfrom pathlib import Path\nimport json\nimport unittest\n\nROOT = Path(__file__).parents[1]\nCOMP = ROOT / \"custom_components\" / \"reolink_battery\"\n\n\nclass RecordingDedupeV121Tests(unittest.TestCase):\n    def test_version(self):\n        manifest = json.loads((COMP / \"manifest.json\").read_text())\n        self.assertEqual(manifest[\"version\"], \"1.2.1\")\n\n    def test_persistent_fingerprint_store(self):\n        events = (COMP / \"events.py\").read_text()\n        coordinator = (COMP / \"coordinator.py\").read_text()\n        self.assertIn(\"class CompletedRecording\", events)\n        self.assertIn('\\\"completed_recordings\\\"', events)\n        self.assertIn(\"completed_recording_fingerprints\", events)\n        self.assertIn(\"remember_completed_recording\", events)\n        self.assertIn(\"completed_recording: CompletedRecording | None = None\", coordinator)\n\n    def test_candidate_dedupe_happens_before_cmd13(self):\n        source = (COMP / \"recording_download_probe.py\").read_text()\n        gate = source.index(\"candidate_fingerprint in completed_recording_fingerprints\")\n        cmd13 = source.index(\"_build_cmd13_wire(host.baichuan, uid, candidate)\", gate)\n        self.assertLess(gate, cmd13)\n        self.assertIn(\"RecordingAlreadyCompletedError\", source)\n\n    def test_worker_suppresses_second_ready_event(self):\n        source = (COMP / \"recording_worker.py\").read_text()\n        catch = source.index(\"except RecordingAlreadyCompletedError as err:\")\n        camera_error = source.index(\"except CameraStageError as err:\", catch)\n        duplicate_block = source[catch:camera_error]\n        self.assertIn(\"async_complete_event(event.event_id)\", duplicate_block)\n        self.assertIn(\"deduplicated_recordings += 1\", duplicate_block)\n        self.assertNotIn(\"RECORDING_READY_EVENT\", duplicate_block)\n        self.assertIn(\"completed_recording=CompletedRecording(\", source)\n\n    def test_fingerprint_is_non_reversible_hash(self):\n        source = (COMP / \"recording_probe.py\").read_text()\n        self.assertIn(\"def recording_fingerprint\", source)\n        self.assertIn(\"hashlib.sha256\", source)\n        self.assertIn(\"candidate.record_id\", source)\n        self.assertIn(\"candidate.start_time.isoformat\", source)\n\n    def test_diagnostics_are_secret_safe(self):\n        source = (COMP / \"diagnostics.py\").read_text()\n        self.assertIn('\\\"completed_recording_count\\\"', source)\n        self.assertIn('\\\"deduplicated_recordings\\\"', source)\n        self.assertIn('\\\"last_duplicate_recording_fingerprint_present\\\"', source)\n        self.assertNotIn('\\\"last_duplicate_recording_fingerprint\\\":', source)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')
          PY

      - name: Compile and run v1.2.1 regression tests
        shell: bash
        run: |
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_dedupe_v121.py

      - name: Verify transport baseline unchanged
        shell: bash
        run: |
          git diff --exit-code v1.2.0 -- \
            custom_components/reolink_battery/transport.py \
            custom_components/reolink_battery/recording_download_beta22.py \
            custom_components/reolink_battery/recording_download_probe_beta14.py \
            custom_components/reolink_battery/recording_download_probe_beta15.py \
            custom_components/reolink_battery/recording_download_probe_beta16.py \
            custom_components/reolink_battery/recording_download_probe_beta17.py \
            custom_components/reolink_battery/recording_download_probe_beta18.py \
            custom_components/reolink_battery/recording_download_probe_beta19.py \
            custom_components/reolink_battery/recording_download_probe_beta20.py \
            custom_components/reolink_battery/recording_download_probe_beta21.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-recording-dedupe-v121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: deduplicate completed recordings before download"
          git push origin HEAD:fix/recording-dedupe-1.2.1
