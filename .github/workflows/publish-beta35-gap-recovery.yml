name: Publish beta.35 gap recovery telemetry

on:
  push:
    paths:
      - '.github/workflows/publish-beta35-gap-recovery.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install -q reolink-aio==0.21.8 pycryptodomex==3.23.0

      - name: Patch beta.35 telemetry-only gap recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          beta20 = Path('custom_components/reolink_battery/recording_download_probe_beta20.py')
          beta21 = Path('custom_components/reolink_battery/recording_download_probe_beta21.py')
          diagnostics = Path('custom_components/reolink_battery/diagnostics.py')
          manifest = Path('custom_components/reolink_battery/manifest.json')

          beta20_before = beta20.read_text()
          beta21_before = beta21.read_bytes()

          def sender_block(source: str) -> str:
              start = source.index('    async def _send_reliable_download_packet(')
              end = source.index('    def _apply_udp_reliability_trace(', start)
              return source[start:end]

          sender_before = sender_block(beta20_before)
          text = beta20_before

          old = '''    udp_seq_at_remote_disconnect: int | None = None\n    udp_snapshot_from_local_protocol: bool = False\n'''
          new = '''    udp_seq_at_remote_disconnect: int | None = None\n    udp_snapshot_from_local_protocol: bool = False\n    udp_network_bc_datagrams_received: int = 0\n    udp_highest_network_seq_seen: int | None = None\n    udp_recovered_missing_packet_count: int = 0\n    udp_unresolved_missing_packet_count_at_disconnect: int = 0\n    udp_buffered_out_of_order_at_disconnect: int = 0\n    udp_highest_buffered_seq_at_disconnect: int | None = None\n    udp_expected_next_seq_at_disconnect: int | None = None\n    udp_max_gap_recovery_ms: float | None = None\n'''
          if old not in text:
              raise SystemExit('beta20 trace field guard failed')
          text = text.replace(old, new, 1)

          old = '''        self.udp_seq_at_remote_disconnect: int | None = None\n        self._missing_seq_ids_seen: set[int] = set()\n        self._cmd8_delivery_future: asyncio.Future[bool] | None = None\n'''
          new = '''        self.udp_seq_at_remote_disconnect: int | None = None\n        self.udp_network_bc_datagrams_received = 0\n        self.udp_highest_network_seq_seen: int | None = None\n        self.udp_recovered_missing_packet_count = 0\n        self.udp_unresolved_missing_packet_count_at_disconnect = 0\n        self.udp_buffered_out_of_order_at_disconnect = 0\n        self.udp_highest_buffered_seq_at_disconnect: int | None = None\n        self.udp_expected_next_seq_at_disconnect: int | None = None\n        self.udp_max_gap_recovery_ms: float | None = None\n        self._missing_seq_ids_seen: set[int] = set()\n        self._recovered_missing_seq_ids: set[int] = set()\n        self._missing_seq_first_seen_at: dict[int, float] = {}\n        self._cmd8_delivery_future: asyncio.Future[bool] | None = None\n'''
          if old not in text:
              raise SystemExit('beta20 protocol init guard failed')
          text = text.replace(old, new, 1)

          marker = '    def parse_udp_ack(self, port: int) -> None:\n'
          if text.count(marker) != 1:
              raise SystemExit('beta20 parse_udp_ack insertion guard failed')
          insertion = '''    def datagram_received(self, data: bytes, addr: tuple[str, int]) -> None:\n        \"\"\"Track real network BC datagrams separately from buffered reprocessing.\"\"\"\n        if len(data) >= 20 and data[:4] == bytes.fromhex(\"10cf872a\"):\n            client_id = int.from_bytes(data[4:8], \"little\")\n            if client_id == self.client_id:\n                seq_id = int.from_bytes(data[12:16], \"little\")\n                self.udp_network_bc_datagrams_received += 1\n                if (\n                    self.udp_highest_network_seq_seen is None\n                    or seq_id > self.udp_highest_network_seq_seen\n                ):\n                    self.udp_highest_network_seq_seen = seq_id\n                if (\n                    seq_id in self._missing_seq_ids_seen\n                    and seq_id not in self._recovered_missing_seq_ids\n                ):\n                    self._recovered_missing_seq_ids.add(seq_id)\n                    self.udp_recovered_missing_packet_count = len(\n                        self._recovered_missing_seq_ids\n                    )\n                    first_seen = self._missing_seq_first_seen_at.get(seq_id)\n                    if first_seen is not None:\n                        delay_ms = round(\n                            max(0.0, self._loop.time() - first_seen) * 1000.0, 3\n                        )\n                        if (\n                            self.udp_max_gap_recovery_ms is None\n                            or delay_ms > self.udp_max_gap_recovery_ms\n                        ):\n                            self.udp_max_gap_recovery_ms = delay_ms\n        super().datagram_received(data, addr)\n\n'''
          text = text.replace(marker, insertion + marker, 1)

          old = '''                    newly_seen = missing - self._missing_seq_ids_seen\n                    self.udp_missing_packet_count += len(newly_seen)\n                    self._missing_seq_ids_seen.update(newly_seen)\n'''
          new = '''                    newly_seen = missing - self._missing_seq_ids_seen\n                    self.udp_missing_packet_count += len(newly_seen)\n                    now = self._loop.time()\n                    for missing_seq in newly_seen:\n                        self._missing_seq_first_seen_at.setdefault(missing_seq, now)\n                    self._missing_seq_ids_seen.update(newly_seen)\n'''
          if old not in text:
              raise SystemExit('beta20 gap first-seen guard failed')
          text = text.replace(old, new, 1)

          old = '''    def parse_udp_connection(self, port: int) -> None:\n        if _packet_is_remote_disconnect(self._udp_data):\n            self.remote_disconnect_observed = True\n            self.udp_seq_at_remote_disconnect = (\n                self._recv_seq_id if self._recv_seq_id >= 0 else None\n            )\n        super().parse_udp_connection(port)\n'''
          new = '''    def parse_udp_connection(self, port: int) -> None:\n        if _packet_is_remote_disconnect(self._udp_data):\n            self.remote_disconnect_observed = True\n            self.udp_seq_at_remote_disconnect = (\n                self._recv_seq_id if self._recv_seq_id >= 0 else None\n            )\n            unresolved = (\n                self._missing_seq_ids_seen - self._recovered_missing_seq_ids\n            )\n            self.udp_unresolved_missing_packet_count_at_disconnect = len(unresolved)\n            self.udp_buffered_out_of_order_at_disconnect = len(self._seq_data)\n            self.udp_highest_buffered_seq_at_disconnect = (\n                max(self._seq_data) if self._seq_data else None\n            )\n            self.udp_expected_next_seq_at_disconnect = self._recv_seq_id + 1\n        super().parse_udp_connection(port)\n'''
          if old not in text:
              raise SystemExit('beta20 disconnect snapshot guard failed')
          text = text.replace(old, new, 1)

          old = '''            trace.udp_last_contiguous_seq = snapshot_protocol.udp_last_contiguous_seq\n            trace.udp_seq_at_remote_disconnect = snapshot_protocol.udp_seq_at_remote_disconnect\n'''
          new = '''            trace.udp_last_contiguous_seq = snapshot_protocol.udp_last_contiguous_seq\n            trace.udp_seq_at_remote_disconnect = snapshot_protocol.udp_seq_at_remote_disconnect\n            trace.udp_network_bc_datagrams_received = (\n                snapshot_protocol.udp_network_bc_datagrams_received\n            )\n            trace.udp_highest_network_seq_seen = (\n                snapshot_protocol.udp_highest_network_seq_seen\n            )\n            trace.udp_recovered_missing_packet_count = (\n                snapshot_protocol.udp_recovered_missing_packet_count\n            )\n            trace.udp_unresolved_missing_packet_count_at_disconnect = (\n                snapshot_protocol.udp_unresolved_missing_packet_count_at_disconnect\n            )\n            trace.udp_buffered_out_of_order_at_disconnect = (\n                snapshot_protocol.udp_buffered_out_of_order_at_disconnect\n            )\n            trace.udp_highest_buffered_seq_at_disconnect = (\n                snapshot_protocol.udp_highest_buffered_seq_at_disconnect\n            )\n            trace.udp_expected_next_seq_at_disconnect = (\n                snapshot_protocol.udp_expected_next_seq_at_disconnect\n            )\n            trace.udp_max_gap_recovery_ms = snapshot_protocol.udp_max_gap_recovery_ms\n'''
          if old not in text:
              raise SystemExit('beta20 trace copy guard failed')
          text = text.replace(old, new, 1)

          # Preserve the local protocol snapshot even if beta20 is invoked directly.
          old = '            self._apply_udp_reliability_trace(trace)\n'
          new = '            self._apply_udp_reliability_trace(trace, protocol=protocol)\n'
          if text.count(old) != 1:
              raise SystemExit(f'beta20 local snapshot call guard failed: {text.count(old)}')
          text = text.replace(old, new, 1)

          beta20.write_text(text)

          # Hard behavior guards: reliable sender and active beta21 path are byte-identical.
          assert sender_block(text) == sender_before, 'reliable sender behavior changed'
          assert beta21.read_bytes() == beta21_before, 'beta21 behavior changed'

          dtext = diagnostics.read_text()
          old = '''                \"udp_snapshot_from_local_protocol\": (\n                    stream.udp_snapshot_from_local_protocol\n                ),\n                \"remote_disconnect_observed\": stream.remote_disconnect_observed,\n'''
          new = '''                \"udp_snapshot_from_local_protocol\": (\n                    stream.udp_snapshot_from_local_protocol\n                ),\n                \"udp_network_bc_datagrams_received\": (\n                    stream.udp_network_bc_datagrams_received\n                ),\n                \"udp_highest_network_seq_seen\": stream.udp_highest_network_seq_seen,\n                \"udp_recovered_missing_packet_count\": (\n                    stream.udp_recovered_missing_packet_count\n                ),\n                \"udp_unresolved_missing_packet_count_at_disconnect\": (\n                    stream.udp_unresolved_missing_packet_count_at_disconnect\n                ),\n                \"udp_buffered_out_of_order_at_disconnect\": (\n                    stream.udp_buffered_out_of_order_at_disconnect\n                ),\n                \"udp_highest_buffered_seq_at_disconnect\": (\n                    stream.udp_highest_buffered_seq_at_disconnect\n                ),\n                \"udp_expected_next_seq_at_disconnect\": (\n                    stream.udp_expected_next_seq_at_disconnect\n                ),\n                \"udp_max_gap_recovery_ms\": stream.udp_max_gap_recovery_ms,\n                \"remote_disconnect_observed\": stream.remote_disconnect_observed,\n'''
          if old not in dtext:
              raise SystemExit('diagnostics gap recovery insertion guard failed')
          dtext = dtext.replace(old, new, 1)
          old = '        \"milestone\": \"3B.8-rx-telemetry-preserved\",\n'
          new = '        \"milestone\": \"3B.9-gap-recovery-telemetry\",\n'
          if old not in dtext:
              raise SystemExit('diagnostics milestone guard failed')
          diagnostics.write_text(dtext.replace(old, new, 1))

          mtext = manifest.read_text()
          if '"version": "0.1.2-beta.34"' not in mtext:
              raise SystemExit('manifest version guard failed')
          manifest.write_text(mtext.replace('"version": "0.1.2-beta.34"', '"version": "0.1.2-beta.35"', 1))

          test = Path('tests/test_recording_download_beta35.py')
          test.write_text('''\"\"\"Regression guards for beta.35 gap recovery telemetry.\"\"\"\n\nfrom pathlib import Path\nimport unittest\n\nROOT = Path(__file__).parents[1]\nBETA20 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_probe_beta20.py\"\nBETA21 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_probe_beta21.py\"\n\n\nclass Beta35GapRecoveryTelemetryTests(unittest.TestCase):\n    def test_tracks_real_network_datagrams_and_gap_recovery(self):\n        source = BETA20.read_text()\n        for token in (\n            \"udp_network_bc_datagrams_received\",\n            \"udp_recovered_missing_packet_count\",\n            \"udp_unresolved_missing_packet_count_at_disconnect\",\n            \"udp_buffered_out_of_order_at_disconnect\",\n            \"udp_expected_next_seq_at_disconnect\",\n            \"udp_max_gap_recovery_ms\",\n        ):\n            self.assertIn(token, source)\n        self.assertIn(\"def datagram_received(self, data: bytes, addr: tuple[str, int])\", source)\n        self.assertIn(\"self._missing_seq_ids_seen - self._recovered_missing_seq_ids\", source)\n\n    def test_transport_timing_and_retransmit_limits_unchanged(self):\n        source = BETA20.read_text()\n        self.assertIn(\"RELIABLE_UDP_ACK_TIMEOUT = 0.5\", source)\n        self.assertIn(\"RELIABLE_UDP_MAX_RETRANSMITS = 2\", source)\n        self.assertIn(\"P2P_HEARTBEAT_INTERVAL = 1.0\", source)\n\n    def test_beta21_still_uses_saved_protocol_snapshot(self):\n        source = BETA21.read_text()\n        self.assertIn(\"self._apply_udp_reliability_trace(trace, protocol=protocol)\", source)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')
          PY

      - name: Verify beta.35 source
        shell: bash
        run: |
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_download_beta32.py
          python tests/test_recording_download_beta34.py
          python tests/test_recording_download_beta35.py
          python tests/test_recording_download_probe.py
          python - <<'PY'
          from pathlib import Path
          beta20 = Path('custom_components/reolink_battery/recording_download_probe_beta20.py').read_text()
          beta21 = Path('custom_components/reolink_battery/recording_download_probe_beta21.py').read_text()
          diagnostics = Path('custom_components/reolink_battery/diagnostics.py').read_text()
          manifest = Path('custom_components/reolink_battery/manifest.json').read_text()
          assert '"version": "0.1.2-beta.35"' in manifest
          assert '3B.9-gap-recovery-telemetry' in diagnostics
          assert 'udp_unresolved_missing_packet_count_at_disconnect' in diagnostics
          assert 'udp_buffered_out_of_order_at_disconnect' in diagnostics
          assert 'RELIABLE_UDP_ACK_TIMEOUT = 0.5' in beta20
          assert 'RELIABLE_UDP_MAX_RETRANSMITS = 2' in beta20
          assert 'P2P_HEARTBEAT_INTERVAL = 1.0' in beta20
          assert 'self._apply_udp_reliability_trace(trace, protocol=protocol)' in beta21
          PY

      - name: Commit beta.35 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/reolink_battery/recording_download_probe_beta20.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  tests/test_recording_download_beta35.py
          git commit -m 'Measure UDP gap recovery at remote disconnect'
          git push origin HEAD:feature/recording-worker-3b2
          echo "BETA35_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish beta.35 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.2-beta.35 \
            --target "$BETA35_SHA" \
            --prerelease \
            --title 'v0.1.2-beta.35' \
            --notes 'Milestone 3B.9 telemetry-only follow-up on beta.34. Transport behavior is intentionally unchanged: single-lease handoff, one continuous C2D_HB sender, 0.5-second cmd13/cmd8 ACK timeout, maximum two same-sequence retransmissions, handle-bound full-high/mainStream cmd8, worker retry policy, verified atomic MP4 persistence and Media/Telegram handoff are unchanged. This release separates real network BC datagrams from buffered packet reprocessing and records gap recovery: highest network sequence seen, recovered missing packet count, unresolved missing packet count at D2C_DISC, buffered out-of-order count/highest buffered sequence at disconnect, expected next sequence and maximum observed gap-recovery delay. This determines whether the gaps seen in beta.34 remained unresolved when the camera disconnected or were successfully recovered beforehand. No cmd234, cmd9, timing or download framing change is introduced.'

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git pull --ff-only origin feature/recording-worker-3b2
          git rm .github/workflows/publish-beta35-gap-recovery.yml
          git commit -m 'Remove temporary beta.35 publish workflow'
          git push origin HEAD:feature/recording-worker-3b2
