name: Publish 3B.2b Id-only beta15

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-3b2b-idonly-beta15.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol dependencies
        run: python -m pip install pycryptodomex==3.23.0 reolink-aio==0.21.8
      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery
      - name: Run recording tests
        run: python -m unittest tests.test_recording_probe tests.test_recording_download_probe tests.test_recording_download_beta12 tests.test_recording_download_beta13 tests.test_recording_download_beta14 tests.test_recording_download_beta15 -v
      - name: Validate JSON
        run: python -m json.tool custom_components/reolink_battery/manifest.json >/dev/null && python -m json.tool custom_components/reolink_battery/strings.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/en.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/he.json >/dev/null
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-beta.15 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.2-beta.15 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.2-beta.15" \
            --notes "Milestone 3B.2b controlled cmd13 Id-only payload probe. Keeps beta.14 0x6482 framing, header channel 7, stream header 0, msgNum16, AES handling, binary Extension and FileInfo search unchanged. Changes only the cmd13 FileInfo body to the minimal public id strategy: logical channelId plus exact recording Id; uid, fileName, name, streamType, fileType, recordType and start/end times are omitted. No cmd8 media transfer, automatic worker, queue removal, or Telegram."
