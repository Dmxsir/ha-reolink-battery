name: Publish 3B.1 beta.2

on:
  push:
    branches:
      - feature/notification-bridge-3b1
    paths:
      - .github/workflows/publish-beta-3b1-2.yml
      - custom_components/reolink_battery/manifest.json
      - custom_components/reolink_battery/notification_bridge.py
      - custom_components/reolink_battery/__init__.py
      - tests/test_notification_bridge.py

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run notification bridge tests
        run: python -m unittest discover -s tests -p 'test_notification_bridge.py' -v
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1-beta.2 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.1-beta.2 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.1-beta.2" \
            --notes "Milestone 3B.1 telemetry validation build. Preserves the last matched Reolink notification across unrelated phone notifications and restores notification diagnostics from the persistent pending queue after integration reload. No automatic camera wake, recording search/download, or Telegram delivery."
