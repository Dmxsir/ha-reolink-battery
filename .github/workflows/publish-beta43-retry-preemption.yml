name: Publish beta.43 retry preemption

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta43-retry-preemption.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch beta.43 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          worker_path = root / 'custom_components/reolink_battery/recording_worker.py'
          diagnostics_path = root / 'custom_components/reolink_battery/diagnostics.py'
          manifest_path = root / 'custom_components/reolink_battery/manifest.json'
          beta42_test_path = root / 'tests/test_recording_worker_beta42.py'
          beta43_test_path = root / 'tests/test_recording_worker_beta43.py'

          worker = worker_path.read_text()

          old_state = '''    deferred_count: int = 0\n    deferred_rearmed_count: int = 0\n    last_event_time: datetime | None = None\n'''
          new_state = '''    deferred_count: int = 0\n    deferred_rearmed_count: int = 0\n    retry_preemptions: int = 0\n    last_preempted_event_time: datetime | None = None\n    last_preempting_event_time: datetime | None = None\n    prior_attempt_event_time: datetime | None = None\n    prior_attempt_time: datetime | None = None\n    prior_failure_stage: str = \"\"\n    prior_failure_type: str = \"\"\n    prior_uid_resolve_succeeded: bool = False\n    prior_uid_resolve_elapsed_ms: float | None = None\n    prior_stream_termination_reason: str = \"\"\n    prior_stream_elapsed_seconds: float | None = None\n    prior_stream_file_bytes: int = 0\n    prior_stream_expected_size: int | None = None\n    prior_stream_remote_disconnect: bool = False\n    last_event_time: datetime | None = None\n'''
          if old_state not in worker:
              raise SystemExit('beta43 worker state anchor not found')
          worker = worker.replace(old_state, new_state, 1)

          defer_anchor = '''    def _defer_event(self, event: CloudEvent) -> None:\n        \"\"\"Defer a failed event without deleting it from persistent storage.\"\"\"\n        self._deferred_event_ids.add(event.event_id)\n        self.state.deferred_count = len(self._deferred_event_ids)\n        self.state.last_deferred_event_time = (\n            event.notification_post_time or event.alarm_time\n        )\n\n'''
          defer_replacement = defer_anchor + '''    @staticmethod\n    def _event_time(event: CloudEvent) -> datetime:\n        return event.notification_post_time or event.alarm_time\n\n    def _newer_pending_event(self, event: CloudEvent) -> CloudEvent | None:\n        \"\"\"Return a newer non-deferred Android event, if one is queued.\"\"\"\n        newest = self._next_android_event()\n        if newest is None or newest.event_id == event.event_id:\n            return None\n        if self._event_time(newest) <= self._event_time(event):\n            return None\n        return newest\n\n    def _record_retry_preemption(\n        self, event: CloudEvent, newer: CloudEvent\n    ) -> None:\n        self.state.retry_preemptions += 1\n        self.state.last_preempted_event_time = self._event_time(event)\n        self.state.last_preempting_event_time = self._event_time(newer)\n\n    async def _wait_retry_or_newer_event(\n        self, event: CloudEvent, seconds: float\n    ) -> bool:\n        \"\"\"Wait for retry delay, but yield immediately to a newer motion.\n\n        Returns True only when the full retry delay elapsed. A False result means\n        shutdown or a newer queued motion should take priority. No camera session\n        is opened by this wait.\n        \"\"\"\n        newer = self._newer_pending_event(event)\n        if newer is not None:\n            self._record_retry_preemption(event, newer)\n            return False\n        if seconds <= 0:\n            return not self._stopped.is_set()\n\n        loop = asyncio.get_running_loop()\n        deadline = loop.time() + seconds\n        self.state.waiting_camera_closed = True\n        try:\n            while not self._stopped.is_set():\n                remaining = deadline - loop.time()\n                if remaining <= 0:\n                    return True\n                try:\n                    await asyncio.wait_for(self._trigger.wait(), timeout=remaining)\n                except TimeoutError:\n                    return True\n                if self._stopped.is_set():\n                    return False\n                self._trigger.clear()\n                self.state.pending_trigger = False\n                newer = self._newer_pending_event(event)\n                if newer is not None:\n                    self._record_retry_preemption(event, newer)\n                    return False\n            return False\n        finally:\n            self.state.waiting_camera_closed = False\n\n'''
          if defer_anchor not in worker:
              raise SystemExit('beta43 defer anchor not found')
          worker = worker.replace(defer_anchor, defer_replacement, 1)

          import_anchor = '''        from .recording_download_beta22 import (\n            apply_stream_probe_trace,\n            async_prepare_download_for_event,\n            reset_stream_probe_state,\n        )\n\n        self.state.attempts += 1\n'''
          import_replacement = '''        from .recording_download_beta22 import (\n            apply_stream_probe_trace,\n            async_prepare_download_for_event,\n            reset_stream_probe_state,\n            stream_probe_state,\n        )\n\n        if self.state.last_attempt_time is not None:\n            prior_trace = stream_probe_state(self._entry.entry_id)\n            self.state.prior_attempt_event_time = self.state.last_event_time\n            self.state.prior_attempt_time = self.state.last_attempt_time\n            self.state.prior_failure_stage = self.state.last_failure_stage\n            self.state.prior_failure_type = self.state.last_failure_type\n            self.state.prior_uid_resolve_succeeded = (\n                self.state.last_uid_resolve_succeeded\n            )\n            self.state.prior_uid_resolve_elapsed_ms = (\n                self.state.last_uid_resolve_elapsed_ms\n            )\n            self.state.prior_stream_termination_reason = str(\n                getattr(prior_trace, \"termination_reason\", \"\") or \"\"\n            )\n            self.state.prior_stream_elapsed_seconds = getattr(\n                prior_trace, \"elapsed_seconds\", None\n            )\n            self.state.prior_stream_file_bytes = int(\n                getattr(prior_trace, \"file_bytes_written\", 0) or 0\n            )\n            self.state.prior_stream_expected_size = getattr(\n                prior_trace, \"xml_reported_size\", None\n            )\n            self.state.prior_stream_remote_disconnect = bool(\n                getattr(prior_trace, \"remote_disconnect_observed\", False)\n            )\n\n        self.state.attempts += 1\n'''
          if import_anchor not in worker:
              raise SystemExit('beta43 process snapshot anchor not found')
          worker = worker.replace(import_anchor, import_replacement, 1)

          old_loop = '''            completed = False\n            for attempt in range(MAX_ATTEMPTS_PER_TRIGGER):\n                if self._stopped.is_set():\n                    return\n                if attempt:\n                    self.state.retries += 1\n                    delay = RETRY_DELAYS_SECONDS[\n                        min(attempt - 1, len(RETRY_DELAYS_SECONDS) - 1)\n                    ]\n                    if not await self._wait_camera_closed(delay):\n                        return\n                if await self._process_once(event):\n                    completed = True\n                    break\n\n            if not completed:\n                # Keep the failed event pending, but defer it for this runtime so\n                # it cannot head-of-line block a newer motion event. A config-entry\n                # reload or HA restart clears the in-memory deferral and retries it.\n                self._defer_event(event)\n'''
          new_loop = '''            completed = False\n            preempted = False\n            for attempt in range(MAX_ATTEMPTS_PER_TRIGGER):\n                if self._stopped.is_set():\n                    return\n                if attempt:\n                    delay = RETRY_DELAYS_SECONDS[\n                        min(attempt - 1, len(RETRY_DELAYS_SECONDS) - 1)\n                    ]\n                    if not await self._wait_retry_or_newer_event(event, delay):\n                        if self._stopped.is_set():\n                            return\n                        preempted = True\n                        break\n                    self.state.retries += 1\n                if await self._process_once(event):\n                    completed = True\n                    break\n\n            if not completed and not preempted:\n                # Keep the failed event pending, but defer it for this runtime so\n                # it cannot head-of-line block a newer motion event. A config-entry\n                # reload or HA restart clears the in-memory deferral and retries it.\n                self._defer_event(event)\n'''
          if old_loop not in worker:
              raise SystemExit('beta43 retry loop anchor not found')
          worker = worker.replace(old_loop, new_loop, 1)
          worker_path.write_text(worker)

          diagnostics = diagnostics_path.read_text()
          diag_anchor = '''            \"deferred_rearmed_count\": (\n                worker.state.deferred_rearmed_count if worker else 0\n            ),\n            \"selection_policy\": \"newest_pending_first\",\n            \"deferred_rearm_policy\": \"new_notification\",\n'''
          diag_replacement = '''            \"deferred_rearmed_count\": (\n                worker.state.deferred_rearmed_count if worker else 0\n            ),\n            \"retry_preemptions\": worker.state.retry_preemptions if worker else 0,\n            \"last_preempted_event_time\": (\n                worker.state.last_preempted_event_time.isoformat()\n                if worker and worker.state.last_preempted_event_time else None\n            ),\n            \"last_preempting_event_time\": (\n                worker.state.last_preempting_event_time.isoformat()\n                if worker and worker.state.last_preempting_event_time else None\n            ),\n            \"selection_policy\": \"newest_pending_first\",\n            \"deferred_rearm_policy\": \"new_notification\",\n            \"retry_preemption_policy\": \"newer_notification_before_retry\",\n'''
          if diag_anchor not in diagnostics:
              raise SystemExit('beta43 diagnostics scheduling anchor not found')
          diagnostics = diagnostics.replace(diag_anchor, diag_replacement, 1)

          prior_anchor = '''            \"last_failure_type\": (worker.state.last_failure_type or None) if worker else None,\n            \"last_file_saved\": bool(worker and worker.state.last_file_saved),\n'''
          prior_replacement = '''            \"last_failure_type\": (worker.state.last_failure_type or None) if worker else None,\n            \"prior_attempt\": {\n                \"event_time\": (\n                    worker.state.prior_attempt_event_time.isoformat()\n                    if worker and worker.state.prior_attempt_event_time else None\n                ),\n                \"attempt_time\": (\n                    worker.state.prior_attempt_time.isoformat()\n                    if worker and worker.state.prior_attempt_time else None\n                ),\n                \"failure_stage\": (worker.state.prior_failure_stage or None) if worker else None,\n                \"failure_type\": (worker.state.prior_failure_type or None) if worker else None,\n                \"uid_resolve_succeeded\": bool(\n                    worker and worker.state.prior_uid_resolve_succeeded\n                ),\n                \"uid_resolve_elapsed_ms\": (\n                    worker.state.prior_uid_resolve_elapsed_ms if worker else None\n                ),\n                \"stream_termination_reason\": (\n                    worker.state.prior_stream_termination_reason or None\n                    if worker else None\n                ),\n                \"stream_elapsed_seconds\": (\n                    worker.state.prior_stream_elapsed_seconds if worker else None\n                ),\n                \"stream_file_bytes\": (\n                    worker.state.prior_stream_file_bytes if worker else 0\n                ),\n                \"stream_expected_size\": (\n                    worker.state.prior_stream_expected_size if worker else None\n                ),\n                \"stream_remote_disconnect\": bool(\n                    worker and worker.state.prior_stream_remote_disconnect\n                ),\n            },\n            \"last_file_saved\": bool(worker and worker.state.last_file_saved),\n'''
          if prior_anchor not in diagnostics:
              raise SystemExit('beta43 prior attempt diagnostics anchor not found')
          diagnostics = diagnostics.replace(prior_anchor, prior_replacement, 1)
          diagnostics = diagnostics.replace(
              '"milestone": "3B.16-fresh-first-queue-rearm"',
              '"milestone": "3B.17-fresh-retry-preemption"',
              1,
          )
          diagnostics_path.write_text(diagnostics)

          manifest = manifest_path.read_text()
          if '"version": "0.1.2-beta.42"' not in manifest:
              raise SystemExit('beta43 manifest anchor not found')
          manifest_path.write_text(manifest.replace(
              '"version": "0.1.2-beta.42"',
              '"version": "0.1.2-beta.43"',
              1,
          ))

          beta42 = beta42_test_path.read_text()
          beta42 = beta42.replace(
              '''        self.assertIn('\"milestone\": \"3B.16-fresh-first-queue-rearm\"', diagnostics)\n        self.assertEqual(json.loads(MANIFEST.read_text())[\"version\"], \"0.1.2-beta.42\")\n''',
              '''        version = json.loads(MANIFEST.read_text())[\"version\"]\n        self.assertTrue(version.startswith(\"0.1.2-beta.\"))\n        self.assertGreaterEqual(int(version.rsplit(\".\", 1)[1]), 42)\n''',
              1,
          )
          beta42_test_path.write_text(beta42)

          beta43_test_path.write_text('''\"\"\"Regression guards for beta.43 fresh retry preemption.\"\"\"\n\nfrom pathlib import Path\nimport json\nimport unittest\n\nROOT = Path(__file__).parents[1]\nWORKER = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_worker.py\"\nTRANSPORT = ROOT / \"custom_components\" / \"reolink_battery\" / \"transport.py\"\nBETA20 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_probe_beta20.py\"\nDIAGNOSTICS = ROOT / \"custom_components\" / \"reolink_battery\" / \"diagnostics.py\"\nMANIFEST = ROOT / \"custom_components\" / \"reolink_battery\" / \"manifest.json\"\n\n\nclass Beta43FreshRetryPreemptionTests(unittest.TestCase):\n    def test_retry_wait_yields_to_newer_motion(self):\n        source = WORKER.read_text()\n        self.assertIn(\"def _newer_pending_event\", source)\n        self.assertIn(\"async def _wait_retry_or_newer_event\", source)\n        self.assertIn(\"await asyncio.wait_for(self._trigger.wait(), timeout=remaining)\", source)\n        self.assertIn(\"self._record_retry_preemption(event, newer)\", source)\n        self.assertIn(\"preempted = True\", source)\n        self.assertIn(\"if not completed and not preempted\", source)\n\n    def test_active_download_is_not_cancelled(self):\n        source = WORKER.read_text()\n        self.assertNotIn(\".cancel()\", source)\n        self.assertIn(\"if await self._process_once(event):\", source)\n\n    def test_previous_attempt_snapshot_survives_next_reset(self):\n        source = WORKER.read_text()\n        snapshot = source.index(\"prior_trace = stream_probe_state\")\n        reset = source.index(\"reset_stream_probe_state(\", snapshot)\n        self.assertLess(snapshot, reset)\n        for token in (\n            \"prior_failure_stage\",\n            \"prior_uid_resolve_elapsed_ms\",\n            \"prior_stream_termination_reason\",\n            \"prior_stream_file_bytes\",\n            \"prior_stream_expected_size\",\n        ):\n            self.assertIn(token, source)\n\n    def test_protocol_contracts_remain_beta42(self):\n        transport = TRANSPORT.read_text()\n        beta20 = BETA20.read_text()\n        self.assertIn(\"UID_RESOLVE_TIMEOUT_SECONDS = 15.0\", transport)\n        self.assertIn(\"UID_RESOLVE_RESEND_SECONDS = 0.5\", transport)\n        self.assertIn(\"PERIODIC_RX_ACK_INTERVAL = 0.010\", beta20)\n        self.assertIn(\"P2P_HEARTBEAT_INTERVAL = 1.0\", beta20)\n        self.assertIn(\"activate_fresh_heartbeat_tids_after_login\", beta20)\n\n    def test_diagnostics_and_version(self):\n        diagnostics = DIAGNOSTICS.read_text()\n        self.assertIn('\"retry_preemption_policy\": \"newer_notification_before_retry\"', diagnostics)\n        self.assertIn('\"prior_attempt\": {', diagnostics)\n        self.assertIn('\"milestone\": \"3B.17-fresh-retry-preemption\"', diagnostics)\n        self.assertEqual(json.loads(MANIFEST.read_text())[\"version\"], \"0.1.2-beta.43\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')
          PY

      - name: Verify beta.43 regressions
        run: |
          python -m compileall -q custom_components/reolink_battery
          python -m unittest \
            tests.test_recording_download_beta40 \
            tests.test_recording_download_beta41 \
            tests.test_recording_worker_beta42 \
            tests.test_recording_worker_beta43

      - name: Commit beta.43 source
        id: source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/recording_worker.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  tests/test_recording_worker_beta42.py \
                  tests/test_recording_worker_beta43.py
          git commit -m "Add beta43 fresh retry preemption"
          git push origin HEAD:feature/recording-worker-3b2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish beta.43 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2-beta.43 \
            --repo Dmxsir/ha-reolink-battery \
            --target "${{ steps.source.outputs.sha }}" \
            --title "v0.1.2-beta.43" \
            --prerelease \
            --notes "Milestone 3B.17 changes only worker scheduling/telemetry. A newer Android motion notification can interrupt the 30/60-second retry wait of an older event, so the fresh recording gets the natural camera wake window. Active camera/download sessions are never cancelled. The older event remains pending and can resume afterwards. A compact prior-attempt snapshot preserves failure stage, UID resolve timing and stream outcome when the next attempt resets live telemetry. Beta.42 newest-first queueing, beta.41 15-second LAN discovery, beta.40 post-auth fresh heartbeat IDs, 10 ms periodic-only ACK, cmd13/cmd8 transport, MP4 verification and Telegram handoff are unchanged."

      - name: Remove temporary beta.43 workflow
        if: always()
        shell: bash
        run: |
          git fetch origin feature/recording-worker-3b2
          git checkout -B feature/recording-worker-3b2 origin/feature/recording-worker-3b2
          rm -f .github/workflows/publish-beta43-retry-preemption.yml
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove temporary beta43 publish workflow"
            git push origin HEAD:feature/recording-worker-3b2
          fi
