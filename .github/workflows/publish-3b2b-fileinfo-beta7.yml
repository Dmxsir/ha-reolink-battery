name: Publish 3B.2b FileInfo beta7

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-3b2b-fileinfo-beta7.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol dependencies
        run: python -m pip install pycryptodomex==3.23.0 reolink-aio==0.21.8
      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery
      - name: Run recording tests
        run: python -m unittest tests.test_recording_probe tests.test_recording_download_probe -v
      - name: Validate JSON
        run: python -m json.tool custom_components/reolink_battery/manifest.json >/dev/null && python -m json.tool custom_components/reolink_battery/strings.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/en.json >/dev/null && python -m json.tool custom_components/reolink_battery/translations/he.json >/dev/null
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-beta.7 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.2-beta.7 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.2-beta.7" \
            --notes "Diagnostic-only Milestone 3B.2b build. Keeps the beta.6 cmd13 routing experiment unchanged, but adds secret-safe cmd14/cmd15/cmd16 FileInfoList telemetry: open success/error and response code, handle presence, current page and pages completed, cmd15 exception type/response code, page file count/finished flag, and cmd16 close outcome. No cmd8 full media download, automatic worker, queue removal, or Telegram."
