name: Publish v1.2.1 stable

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.2.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 5e3cae3eb4320e72edc71ac83f2ae10338b2dd73
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          test "$(git show "$RELEASE_SHA":custom_components/reolink_battery/manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "1.2.1"
          git diff --exit-code v1.2.0 "$RELEASE_SHA" -- \
            custom_components/reolink_battery/transport.py \
            custom_components/reolink_battery/recording_download_beta22.py \
            custom_components/reolink_battery/recording_download_probe_beta14.py \
            custom_components/reolink_battery/recording_download_probe_beta15.py \
            custom_components/reolink_battery/recording_download_probe_beta16.py \
            custom_components/reolink_battery/recording_download_probe_beta17.py \
            custom_components/reolink_battery/recording_download_probe_beta18.py \
            custom_components/reolink_battery/recording_download_probe_beta19.py \
            custom_components/reolink_battery/recording_download_probe_beta20.py \
            custom_components/reolink_battery/recording_download_probe_beta21.py

      - name: Create tag and official release
        shell: bash
        run: |
          if git rev-parse -q --verify refs/tags/v1.2.1 >/dev/null; then
            echo "v1.2.1 tag already exists" >&2
            exit 1
          fi
          git tag v1.2.1 "$RELEASE_SHA"
          git push origin refs/tags/v1.2.1
          cat > /tmp/release-notes.md <<'EOF'
          ## Reolink Battery v1.2.1

          Stable patch release that prevents duplicate delivery when multiple Android Reolink notifications resolve to the same physical SD-card recording.

          ### Fixed
          - Adds persistent recording-level deduplication using a bounded SHA-256 fingerprint.
          - Fingerprint is derived from the camera UID plus FileInfo recording identity, start/end timestamps and size; raw recording identities are not exposed in diagnostics.
          - Duplicate notifications still perform the battery-safe wake/auth and FileInfo lookup needed to identify the exact recording, but the duplicate is detected **before cmd13/cmd8**, so the same MP4 is not downloaded twice.
          - A duplicate event is completed silently and does **not** fire a second `reolink_battery_recording_ready` event, preventing duplicate Telegram delivery.
          - Adds secret-safe diagnostics for completed-recording cache size, deduplicated count, last duplicate time/presence and dedupe policy.

          ### Unchanged
          - The validated **v1.2.0 / v0.1.2-beta.45 transport baseline** is unchanged: UID wake, heartbeat, UDP ACK/recovery, cmd13/cmd8 full-high/mainStream download, retries and verified MP4 persistence are untouched.
          - **v0.1.2-beta.45** remains published unchanged as the diagnostic transport reference.

          Primary validated hardware: **Reolink Argus 2E**.
          EOF
          gh release create v1.2.1 \
            --title "v1.2.1" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Remove temporary release workflow
        shell: bash
        run: |
          rm -f .github/workflows/release-v1.2.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary v1.2.1 release workflow"
          git push origin HEAD:main
