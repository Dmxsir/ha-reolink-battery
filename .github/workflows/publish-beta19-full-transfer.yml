name: Publish beta19 full transfer diagnostic

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta19-full-transfer.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wire beta19 diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          button = Path("custom_components/reolink_battery/button.py")
          text = button.read_text()
          text = text.replace(
              "from .recording_download_probe_beta18 import (",
              "from .recording_download_probe_beta19 import (",
          )
          text = text.replace(
              '"""Probe accepted cmd13 then sample cmd8 media in the same session."""',
              '"""Probe cmd13/cmd8 full-transfer shape with same-session keepalive."""',
          )
          text = text.replace(
              '"""Find recording, issue accepted cmd13 then bounded cmd8, then close."""',
              '"""Find recording, run cmd13/cmd8 with keepalive, then close."""',
          )
          button.write_text(text)

          diagnostics = Path("custom_components/reolink_battery/diagnostics.py")
          text = diagnostics.read_text()
          text = text.replace(
              "from .recording_download_probe_beta18 import stream_probe_state",
              "from .recording_download_probe_beta19 import stream_probe_state",
          )
          marker = (
              '                "cmd8_media_observed": stream.cmd8_media_observed,\n'
              '                "distinct_msg_num_count": stream.distinct_msg_num_count,'
          )
          replacement = (
              '                "cmd8_media_observed": stream.cmd8_media_observed,\n'
              '                "keepalive_attempted": stream.keepalive_attempted,\n'
              '                "keepalive_count": stream.keepalive_count,\n'
              '                "keepalive_interval_seconds": stream.keepalive_interval_seconds,\n'
              '                "decoded_cmd8_chunks": stream.decoded_cmd8_chunks,\n'
              '                "decoded_cmd8_bytes": stream.decoded_cmd8_bytes,\n'
              '                "raw_cmd8_chunks": stream.raw_cmd8_chunks,\n'
              '                "nonzero_payload_offset_frames": stream.nonzero_payload_offset_frames,\n'
              '                "aggregate_bytes": stream.aggregate_bytes,\n'
              '                "aggregate_limit_bytes": stream.aggregate_limit_bytes,\n'
              '                "mp4_offset_found": stream.mp4_offset_found,\n'
              '                "mp4_offset": stream.mp4_offset,\n'
              '                "mp4_bytes_collected": stream.mp4_bytes_collected,\n'
              '                "expected_size_reached": stream.expected_size_reached,\n'
              '                "expected_size_match": stream.expected_size_match,\n'
              '                "bcmedia_prefix_bytes": stream.bcmedia_prefix_bytes,\n'
              '                "distinct_msg_num_count": stream.distinct_msg_num_count,'
          )
          if marker not in text:
              raise SystemExit("beta18 diagnostics marker not found")
          text = text.replace(marker, replacement)
          text = text.replace(
              '        "milestone": "3B.2b-cmd13-prepare-cmd8-media-shape-probe",',
              '        "milestone": "3B.2b-cmd8-keepalive-full-transfer-probe",',
          )
          diagnostics.write_text(text)

          manifest = Path("custom_components/reolink_battery/manifest.json")
          text = manifest.read_text().replace(
              '"version": "0.1.2-beta.18"',
              '"version": "0.1.2-beta.19"',
          )
          manifest.write_text(text)
          PY

      - name: Install protocol dependencies
        run: python -m pip install pycryptodomex==3.23.0 reolink-aio==0.21.8

      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery

      - name: Run recording tests
        run: >-
          python -m unittest
          tests.test_recording_probe
          tests.test_recording_download_probe
          tests.test_recording_download_beta12
          tests.test_recording_download_beta13
          tests.test_recording_download_beta14
          tests.test_recording_download_beta15
          tests.test_recording_download_beta16
          tests.test_recording_download_beta17
          tests.test_recording_download_beta18
          tests.test_recording_download_beta19
          -v

      - name: Validate JSON
        run: |
          python -m json.tool custom_components/reolink_battery/manifest.json >/dev/null
          python -m json.tool custom_components/reolink_battery/strings.json >/dev/null
          python -m json.tool custom_components/reolink_battery/translations/en.json >/dev/null
          python -m json.tool custom_components/reolink_battery/translations/he.json >/dev/null

      - name: Commit beta19 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/button.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  custom_components/reolink_battery/recording_download_probe_beta19.py \
                  tests/test_recording_download_beta19.py
          git commit -m "Wire beta19 keepalive full-transfer diagnostic"
          git push origin HEAD:feature/recording-worker-3b2

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-beta.19 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.2-beta.19 \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "Reolink Battery v0.1.2-beta.19" \
            --notes "Milestone 3B.2b full-transfer diagnostic. Keeps the physically validated cmd13 -> cmd8 sequence unchanged and adds only UDP cmd234 keepalive every 0.75s while cmd8 streams. Reassembles decoded cmd8 chunks in memory up to 16 MiB, locates the embedded MP4 ftyp offset, compares collected MP4 bytes with the camera-reported size, and exposes only secret-safe counters. No recording file, cmd9, automatic worker, queue removal, or Telegram."
