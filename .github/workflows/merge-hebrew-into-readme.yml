name: Merge Hebrew into README

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/merge-hebrew-into-readme.yml

permissions:
  contents: write

jobs:
  merge-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Hebrew README into single README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in main feature/recording-worker-3b2; do
            git checkout "$branch"
            git pull --ff-only origin "$branch"

            python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          hebrew = Path('README_HE.md')
          text = readme.read_text(encoding='utf-8')
          he = hebrew.read_text(encoding='utf-8')

          # Add a stable top anchor and point the language selector to the Hebrew section.
          if not text.startswith('<a id="top"></a>'):
              text = '<a id="top"></a>\n\n' + text
          text = text.replace('**English** | [עברית](README_HE.md)', '**English** | [עברית](#hebrew)')

          # Extract the translated body from the existing RTL README, excluding its duplicate
          # title/badges/language selector and the outer RTL wrapper.
          center_end = he.find('</div>')
          if center_end == -1:
              raise SystemExit('Could not find Hebrew header block')
          body = he[center_end + len('</div>'):].strip()
          if body.endswith('</div>'):
              body = body[:-len('</div>')].rstrip()

          # Remove any previous merged Hebrew section if this workflow is re-run.
          marker = '\n---\n\n<a id="hebrew"></a>'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'

          hebrew_section = f'''\n---\n\n<a id="hebrew"></a>\n\n<div dir="rtl" align="right">\n\n## עברית — מצלמת Reolink מבוססת סוללה ל־Home Assistant\n\n{body}\n\n<p align="center" dir="ltr"><a href="#top">↑ Back to English</a></p>\n\n</div>\n'''

          readme.write_text(text.rstrip() + '\n' + hebrew_section, encoding='utf-8')
          PY

            git rm README_HE.md
            git add README.md
            git commit -m "docs: consolidate English and Hebrew README" || true
            git push origin "$branch"
          done

          git checkout main
          git rm .github/workflows/merge-hebrew-into-readme.yml
          git commit -m "chore: remove temporary README merge workflow"
          git push origin main
