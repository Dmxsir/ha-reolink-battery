name: Publish beta.34 RX telemetry

on:
  push:
    paths:
      - '.github/workflows/publish-beta34-rx-snapshot.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        shell: bash
        run: python -m pip install reolink-aio==0.21.8 pycryptodomex==3.23.0

      - name: Patch beta.34 telemetry-only snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          beta20 = Path('custom_components/reolink_battery/recording_download_probe_beta20.py')
          text = beta20.read_text()

          old = '''    udp_max_ack_delay_ms: float | None = None\n    udp_seq_at_remote_disconnect: int | None = None\n'''
          new = '''    udp_max_ack_delay_ms: float | None = None\n    udp_seq_at_remote_disconnect: int | None = None\n    udp_snapshot_from_local_protocol: bool = False\n'''
          if old not in text:
              raise SystemExit('beta20 trace field guard failed')
          text = text.replace(old, new, 1)

          old = '''    def _apply_udp_reliability_trace(self, trace: P2PHeartbeatProbeTrace) -> None:\n        \"\"\"Copy command ACK and receive-gap telemetry into the public trace.\"\"\"\n'''
          new = '''    def _apply_udp_reliability_trace(\n        self,\n        trace: P2PHeartbeatProbeTrace,\n        *,\n        protocol: _P2PHeartbeatProbeProtocol | None = None,\n    ) -> None:\n        \"\"\"Copy command ACK and receive-gap telemetry into the public trace.\n\n        An explicit local protocol reference preserves RX counters after a remote\n        D2C_DISC closes the connection and clears self._protocol.\n        \"\"\"\n'''
          if old not in text:
              raise SystemExit('beta20 apply signature guard failed')
          text = text.replace(old, new, 1)

          old = '''        protocol = self._protocol\n        if isinstance(protocol, _P2PHeartbeatProbeProtocol):\n            trace.udp_bc_packets_received = protocol.udp_bc_packets_received\n'''
          new = '''        snapshot_protocol = protocol\n        if snapshot_protocol is None:\n            current_protocol = self._protocol\n            if isinstance(current_protocol, _P2PHeartbeatProbeProtocol):\n                snapshot_protocol = current_protocol\n        trace.udp_snapshot_from_local_protocol = protocol is not None\n        if isinstance(snapshot_protocol, _P2PHeartbeatProbeProtocol):\n            trace.udp_bc_packets_received = snapshot_protocol.udp_bc_packets_received\n'''
          if old not in text:
              raise SystemExit('beta20 protocol snapshot guard failed')
          text = text.replace(old, new, 1)

          replacements = {
              'protocol.udp_seq_gap_events': 'snapshot_protocol.udp_seq_gap_events',
              'protocol.udp_missing_packet_count': 'snapshot_protocol.udp_missing_packet_count',
              'protocol.udp_out_of_order_packets': 'snapshot_protocol.udp_out_of_order_packets',
              'protocol.udp_duplicate_packets': 'snapshot_protocol.udp_duplicate_packets',
              'protocol.udp_reorder_buffer_peak': 'snapshot_protocol.udp_reorder_buffer_peak',
              'protocol.udp_ack_sent_count': 'snapshot_protocol.udp_ack_sent_count',
              'protocol.udp_ack_with_gap_bitmap_count': 'snapshot_protocol.udp_ack_with_gap_bitmap_count',
              'protocol.udp_last_contiguous_seq': 'snapshot_protocol.udp_last_contiguous_seq',
              'protocol.udp_seq_at_remote_disconnect': 'snapshot_protocol.udp_seq_at_remote_disconnect',
          }
          for old_token, new_token in replacements.items():
              if old_token not in text:
                  raise SystemExit(f'beta20 telemetry token guard failed: {old_token}')
              text = text.replace(old_token, new_token, 1)
          beta20.write_text(text)

          beta21 = Path('custom_components/reolink_battery/recording_download_probe_beta21.py')
          text = beta21.read_text()
          old = '            self._apply_udp_reliability_trace(trace)\n'
          new = '            self._apply_udp_reliability_trace(trace, protocol=protocol)\n'
          if text.count(old) != 1:
              raise SystemExit(f'beta21 trace call guard failed: {text.count(old)}')
          beta21.write_text(text.replace(old, new, 1))

          diagnostics = Path('custom_components/reolink_battery/diagnostics.py')
          text = diagnostics.read_text()
          old = '''                \"udp_seq_at_remote_disconnect\": stream.udp_seq_at_remote_disconnect,\n                \"remote_disconnect_observed\": stream.remote_disconnect_observed,\n'''
          new = '''                \"udp_seq_at_remote_disconnect\": stream.udp_seq_at_remote_disconnect,\n                \"udp_snapshot_from_local_protocol\": (\n                    stream.udp_snapshot_from_local_protocol\n                ),\n                \"remote_disconnect_observed\": stream.remote_disconnect_observed,\n'''
          if old not in text:
              raise SystemExit('diagnostics UDP snapshot field guard failed')
          text = text.replace(old, new, 1)
          old = '        \"milestone\": \"3B.7-reliable-udp-retransmit\",\n'
          new = '        \"milestone\": \"3B.8-rx-telemetry-preserved\",\n'
          if old not in text:
              raise SystemExit('diagnostics milestone guard failed')
          diagnostics.write_text(text.replace(old, new, 1))

          manifest = Path('custom_components/reolink_battery/manifest.json')
          text = manifest.read_text()
          if '"version": "0.1.2-beta.33"' not in text:
              raise SystemExit('manifest version guard failed')
          manifest.write_text(text.replace('"version": "0.1.2-beta.33"', '"version": "0.1.2-beta.34"', 1))

          test = Path('tests/test_recording_download_beta34.py')
          test.write_text('''\"\"\"Regression guards for beta.34 disconnect-safe UDP telemetry.\"\"\"\n\nfrom pathlib import Path\nimport unittest\n\nROOT = Path(__file__).parents[1]\nBETA20 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_probe_beta20.py\"\nBETA21 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_probe_beta21.py\"\n\n\nclass Beta34RxTelemetryTests(unittest.TestCase):\n    def test_beta21_final_snapshot_uses_saved_protocol_reference(self):\n        source = BETA21.read_text()\n        self.assertIn(\n            \"self._apply_udp_reliability_trace(trace, protocol=protocol)\",\n            source,\n        )\n\n    def test_beta20_snapshot_accepts_explicit_protocol(self):\n        source = BETA20.read_text()\n        self.assertIn(\n            \"protocol: _P2PHeartbeatProbeProtocol | None = None\",\n            source,\n        )\n        self.assertIn(\"snapshot_protocol = protocol\", source)\n        self.assertIn(\"udp_snapshot_from_local_protocol\", source)\n\n    def test_beta33_transport_parameters_are_unchanged(self):\n        source = BETA20.read_text()\n        self.assertIn(\"RELIABLE_UDP_ACK_TIMEOUT = 0.5\", source)\n        self.assertIn(\"RELIABLE_UDP_MAX_RETRANSMITS = 2\", source)\n        self.assertIn(\"transport.sendto(packet, (self._host, self._port))\", source)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')
          PY

      - name: Verify beta.34 source
        shell: bash
        run: |
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_download_beta32.py
          python tests/test_recording_download_beta34.py
          python tests/test_recording_download_probe.py
          python - <<'PY'
          from pathlib import Path
          beta20 = Path('custom_components/reolink_battery/recording_download_probe_beta20.py').read_text()
          beta21 = Path('custom_components/reolink_battery/recording_download_probe_beta21.py').read_text()
          manifest = Path('custom_components/reolink_battery/manifest.json').read_text()
          diagnostics = Path('custom_components/reolink_battery/diagnostics.py').read_text()
          assert '"version": "0.1.2-beta.34"' in manifest
          assert '3B.8-rx-telemetry-preserved' in diagnostics
          assert 'RELIABLE_UDP_ACK_TIMEOUT = 0.5' in beta20
          assert 'RELIABLE_UDP_MAX_RETRANSMITS = 2' in beta20
          assert 'protocol: _P2PHeartbeatProbeProtocol | None = None' in beta20
          assert 'self._apply_udp_reliability_trace(trace, protocol=protocol)' in beta21
          PY

      - name: Commit beta.34 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/reolink_battery/recording_download_probe_beta20.py \
                  custom_components/reolink_battery/recording_download_probe_beta21.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  tests/test_recording_download_beta34.py
          git commit -m 'Preserve UDP RX telemetry after remote disconnect'
          git push origin HEAD:feature/recording-worker-3b2
          echo "BETA34_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish beta.34 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.2-beta.34 \
            --target "$BETA34_SHA" \
            --prerelease \
            --title 'v0.1.2-beta.34' \
            --notes 'Milestone 3B.8 telemetry-only correction on top of beta.33. Reliable-UDP behavior is unchanged: the same single-lease handoff, continuous C2D_HB sender, 0.5-second bounded cmd13/cmd8 delivery checks, maximum two same-sequence retransmissions, handle-bound full-high/mainStream cmd8, persistent queue, 60-second settle, verified atomic MP4 persistence and Media handoff remain intact. This release fixes only receive-side diagnostics after D2C_DISC: the download routine now passes its saved local protocol object into the final UDP telemetry snapshot, so BC packet counts, sequence gaps, missing/out-of-order/duplicate counts, reorder-buffer peak, ACK counts/bitmap counts, last contiguous sequence and disconnect sequence survive even after reolink-aio clears self._protocol. Diagnostics expose udp_snapshot_from_local_protocol to prove the preserved snapshot path was used. No cmd9 or transport timing change is introduced.'

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git pull --ff-only origin feature/recording-worker-3b2
          git rm .github/workflows/publish-beta34-rx-snapshot.yml
          git commit -m 'Remove temporary beta.34 publish workflow'
          git push origin HEAD:feature/recording-worker-3b2
