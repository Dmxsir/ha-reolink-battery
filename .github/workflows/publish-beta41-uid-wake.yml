name: Publish beta.41 UID wake reliability

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta41-uid-wake.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch beta.41 source
        run: python tools/patch_beta41_uid_wake.py

      - name: Verify beta.41 regressions
        run: |
          python -m unittest \
            tests.test_recording_download_beta41 \
            tests.test_recording_download_beta40 \
            tests.test_recording_download_beta39 \
            tests.test_recording_download_beta38 \
            tests.test_recording_download_beta37

      - name: Commit beta.41 source
        id: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery tests
          git diff --cached --quiet && { echo "No beta41 source changes"; exit 1; }
          git commit -m "Release Reolink Battery v0.1.2-beta.41"
          git push origin HEAD:feature/recording-worker-3b2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish beta.41 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create v0.1.2-beta.41 \
            --repo Dmxsir/ha-reolink-battery \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "v0.1.2-beta.41" \
            --notes "Milestone 3B.15 improves only battery-camera wake reliability. UID/LAN discovery now keeps the proven 500 ms resend cadence but waits up to 15 seconds, matching Neolink's discovery window, instead of 10 seconds. Secret-safe diagnostics report discovery send rounds, datagram count, elapsed time, configured timeout/cadence and success without exposing UID/IP/network identifiers. Beta.40 post-auth fresh heartbeat IDs, 10 ms periodic-only inclusive-highest RX ACK, single-lease handoff, reliable cmd13/cmd8, full-high/mainStream routing, worker retry policy, exact MP4 verification and Telegram handoff are unchanged."

      - name: Remove temporary beta.41 files
        run: |
          git rm tools/patch_beta41_uid_wake.py .github/workflows/publish-beta41-uid-wake.yml
          git commit -m "Remove beta41 publish helpers"
          git push origin HEAD:feature/recording-worker-3b2
