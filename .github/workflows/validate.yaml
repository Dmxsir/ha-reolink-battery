name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python sources
        run: python -m compileall -q custom_components/reolink_battery
      - name: Notification bridge regression tests
        run: python tests/test_notification_bridge.py
      - name: Recording backlog policy regression tests
        run: python tests/test_recording_backlog_policy.py
      - name: Integration load and startup regression tests
        run: python tests/test_integration_load.py

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
