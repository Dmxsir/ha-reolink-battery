name: Publish beta.45 cmd13 reported-size collector

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta45-cmd13-size.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch beta.45 source
        shell: python
        run: |
          from pathlib import Path
          import json

          beta22 = Path('custom_components/reolink_battery/recording_download_beta22.py')
          source = beta22.read_text()
          old = '''    def _observe_frame(self, frame: beta17._RawDownloadFrame) -> None:\n        super()._observe_frame(frame)\n        if frame.cmd_id == 8 and frame.response_code in (0, 200):\n            self._persist_new_mp4_bytes()\n'''
          new = '''    def _apply_reported_size_collector_limits(self) -> None:\n        \"\"\"Resize verified collection from cmd13's authoritative file size.\n\n        Some Argus FileInfo pages omit a directly parseable size, leaving\n        candidate.size at zero. The accepted cmd13 response carries the actual\n        recording size and is observed before cmd8 starts, so use that value to\n        enlarge only the verified-file collector while retaining the hard cap.\n        \"\"\"\n        expected = int(self._stream_trace.xml_reported_size or 0)\n        if expected <= 0:\n            return\n        collector_bytes, collector_frames = _verified_collector_limits(expected)\n        self._stream_trace.sample_limit_bytes = max(\n            self._stream_trace.sample_limit_bytes, collector_bytes\n        )\n        self._stream_trace.aggregate_limit_bytes = max(\n            self._stream_trace.aggregate_limit_bytes, collector_bytes\n        )\n        self._stream_trace.sample_limit_frames = max(\n            self._stream_trace.sample_limit_frames, collector_frames\n        )\n\n    def _observe_frame(self, frame: beta17._RawDownloadFrame) -> None:\n        super()._observe_frame(frame)\n        if frame.cmd_id == 13 and frame.response_code in (0, 200):\n            self._apply_reported_size_collector_limits()\n        if frame.cmd_id == 8 and frame.response_code in (0, 200):\n            self._persist_new_mp4_bytes()\n'''
          if old not in source:
              raise SystemExit('beta22 observe-frame anchor not found')
          beta22.write_text(source.replace(old, new, 1))

          manifest = Path('custom_components/reolink_battery/manifest.json')
          data = json.loads(manifest.read_text())
          if data.get('version') != '0.1.2-beta.44':
              raise SystemExit(f"unexpected manifest version: {data.get('version')}")
          data['version'] = '0.1.2-beta.45'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          diagnostics = Path('custom_components/reolink_battery/diagnostics.py')
          d = diagnostics.read_text()
          old_m = '"milestone": "3B.18-verified-size-aware-collector"'
          new_m = '"milestone": "3B.19-cmd13-reported-size-collector"'
          if old_m not in d:
              raise SystemExit('beta44 milestone anchor not found')
          diagnostics.write_text(d.replace(old_m, new_m, 1))

          beta44_test = Path('tests/test_recording_download_beta44.py')
          t = beta44_test.read_text()
          old_test = '''        self.assertIn('\"milestone\": \"3B.18-verified-size-aware-collector\"', diagnostics)\n        self.assertEqual(json.loads(MANIFEST.read_text())[\"version\"], \"0.1.2-beta.44\")\n'''
          new_test = '''        self.assertIn('\"milestone\": \"3B.', diagnostics)\n        version = json.loads(MANIFEST.read_text())[\"version\"]\n        self.assertTrue(version.startswith(\"0.1.2-beta.\"))\n        self.assertGreaterEqual(int(version.rsplit(\".\", 1)[1]), 44)\n'''
          if old_test not in t:
              raise SystemExit('beta44 regression anchor not found')
          beta44_test.write_text(t.replace(old_test, new_test, 1))

          Path('tests/test_recording_download_beta45.py').write_text('''\"\"\"Regression guards for beta.45 cmd13 reported-size collector resize.\"\"\"\n\nfrom pathlib import Path\nimport json\nimport unittest\n\nROOT = Path(__file__).parents[1]\nBETA22 = ROOT / \"custom_components\" / \"reolink_battery\" / \"recording_download_beta22.py\"\nDIAGNOSTICS = ROOT / \"custom_components\" / \"reolink_battery\" / \"diagnostics.py\"\nMANIFEST = ROOT / \"custom_components\" / \"reolink_battery\" / \"manifest.json\"\n\n\nclass Beta45Cmd13ReportedSizeCollectorTests(unittest.TestCase):\n    def test_cmd13_reported_size_resizes_before_cmd8_collection(self):\n        source = BETA22.read_text()\n        self.assertIn(\"def _apply_reported_size_collector_limits\", source)\n        self.assertIn(\"self._stream_trace.xml_reported_size\", source)\n        self.assertIn(\"if frame.cmd_id == 13 and frame.response_code in (0, 200):\", source)\n        self.assertIn(\"self._apply_reported_size_collector_limits()\", source)\n        observe = source[source.index(\"    def _observe_frame\"):source.index(\"    def _remove_part\")]\n        self.assertLess(\n            observe.index(\"self._apply_reported_size_collector_limits()\"),\n            observe.index(\"self._persist_new_mp4_bytes()\"),\n        )\n\n    def test_argus_17921985_cmd13_size_gets_22116289_limit(self):\n        expected = 17_921_985\n        base = 16 * 1024 * 1024\n        overhead = 4 * 1024 * 1024\n        hard = 128 * 1024 * 1024\n        limit = min(max(base, expected + overhead), hard)\n        self.assertEqual(limit, 22_116_289)\n        self.assertGreater(limit, expected)\n\n    def test_zero_candidate_size_is_safe_until_cmd13_reports_size(self):\n        base = 16 * 1024 * 1024\n        overhead = 4 * 1024 * 1024\n        hard = 128 * 1024 * 1024\n        candidate_limit = min(max(base, 0 + overhead), hard)\n        cmd13_limit = min(max(base, 17_921_985 + overhead), hard)\n        self.assertEqual(candidate_limit, base)\n        self.assertGreater(cmd13_limit, candidate_limit)\n\n    def test_version_and_milestone(self):\n        self.assertEqual(json.loads(MANIFEST.read_text())[\"version\"], \"0.1.2-beta.45\")\n        self.assertIn('\"milestone\": \"3B.19-cmd13-reported-size-collector\"', DIAGNOSTICS.read_text())\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')

      - name: Verify beta.45 regressions
        run: |
          python -m unittest tests.test_recording_download_beta44 tests.test_recording_download_beta45 tests.test_recording_worker_beta43
          python -m compileall -q custom_components/reolink_battery

      - name: Commit beta.45 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/recording_download_beta22.py custom_components/reolink_battery/manifest.json custom_components/reolink_battery/diagnostics.py tests/test_recording_download_beta44.py tests/test_recording_download_beta45.py
          git commit -m "Fix verified collector sizing from cmd13 reported size"
          git push origin HEAD:feature/recording-worker-3b2

      - name: Publish beta.45 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          gh release create v0.1.2-beta.45 \
            --repo Dmxsir/ha-reolink-battery \
            --target "$SOURCE_SHA" \
            --title "v0.1.2-beta.45" \
            --prerelease \
            --notes "Milestone 3B.19 fixes beta.44's remaining 16 MiB collector stop when Argus FileInfo omits a usable candidate size. The verified-file connection now resizes its byte/frame collector immediately after the accepted cmd13 response exposes the authoritative XML-reported recording size, before cmd8 starts. For the observed 17,921,985-byte recording this yields a 22,116,289-byte collector limit. The 128 MiB hard cap remains, manual diagnostic probes remain 16 MiB, and beta.43 scheduling/preemption plus beta.40/41 wake, heartbeat, ACK, cmd13/cmd8 and Telegram behavior are unchanged."

      - name: Remove temporary beta.45 workflow
        run: |
          git rm .github/workflows/publish-beta45-cmd13-size.yml
          git commit -m "Remove temporary beta45 publish workflow"
          git push origin HEAD:feature/recording-worker-3b2
