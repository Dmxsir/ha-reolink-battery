name: Publish 3B.1 beta

on:
  push:
    branches:
      - feature/notification-bridge-3b1
    paths:
      - .github/workflows/publish-beta-3b1.yml
      - custom_components/reolink_battery/manifest.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1-beta.1 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.1-beta.1 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Reolink Battery v0.1.1-beta.1" \
            --notes "Milestone 3B.1 beta for real Home Assistant validation. Adds the optional HA Companion Last Notification bridge for legacy Argus motion triggers, deterministic deduplication, queue ingestion, diagnostics, and translations. This build does not wake the camera automatically, perform recording search/download, or send Telegram."
