name: Publish beta.31 continuous P2P heartbeat

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta31-continuous-heartbeat.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check reolink-aio==0.21.8 pycryptodomex==3.23.0

      - name: Apply beta.31 source changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          beta20_path = Path("custom_components/reolink_battery/recording_download_probe_beta20.py")
          beta20 = beta20_path.read_text()

          old_trace = '''    p2p_heartbeat_attempted: bool = False\n    p2p_heartbeat_count: int = 0\n    p2p_heartbeat_interval_seconds: float = P2P_HEARTBEAT_INTERVAL\n    proactive_cmd234_count: int = 0\n'''
          new_trace = '''    p2p_heartbeat_attempted: bool = False\n    p2p_heartbeat_count: int = 0\n    p2p_heartbeat_interval_seconds: float = P2P_HEARTBEAT_INTERVAL\n    p2p_heartbeat_started_after_handoff: bool = False\n    p2p_heartbeat_first_delay_seconds: float | None = None\n    p2p_heartbeat_pre_cmd13_count: int = 0\n    p2p_heartbeat_background_task_active: bool = False\n    proactive_cmd234_count: int = 0\n'''
          assert old_trace in beta20, "beta30 heartbeat trace anchor not found"
          beta20 = beta20.replace(old_trace, new_trace, 1)

          old_init = '''        self._stream_trace = _new_trace(attempted=True)\n        self._p2p_heartbeat_tid: int | None = None\n'''
          new_init = '''        self._stream_trace = _new_trace(attempted=True)\n        self._p2p_heartbeat_tid: int | None = None\n        self._p2p_heartbeat_task: asyncio.Task[None] | None = None\n        self._p2p_heartbeat_started_at: float | None = None\n        self._p2p_heartbeat_first_sent_at: float | None = None\n        self._p2p_heartbeat_total_count = 0\n        self._p2p_heartbeat_started_after_handoff = False\n'''
          assert old_init in beta20, "beta30 heartbeat init anchor not found"
          beta20 = beta20.replace(old_init, new_init, 1)

          old_send_tail = '''        transport.sendto(packet, (self._host, self._port))\n        return True\n\n    async def send_file_download_probe(\n'''
          new_send_tail = '''        transport.sendto(packet, (self._host, self._port))\n        return True\n\n    def _record_p2p_heartbeat(self) -> bool:\n        \"\"\"Send one heartbeat and update connection-lifetime counters.\"\"\"\n        if not self._send_p2p_heartbeat():\n            return False\n        now = self._loop.time()\n        self._p2p_heartbeat_total_count += 1\n        if self._p2p_heartbeat_first_sent_at is None:\n            self._p2p_heartbeat_first_sent_at = now\n        return True\n\n    def _apply_p2p_heartbeat_trace(\n        self,\n        trace: P2PHeartbeatProbeTrace,\n        *,\n        snapshot_pre_cmd13: bool = False,\n    ) -> None:\n        \"\"\"Copy secret-safe connection-lifetime heartbeat facts into a trace.\"\"\"\n        trace.p2p_heartbeat_attempted = self._p2p_heartbeat_total_count > 0\n        trace.p2p_heartbeat_count = self._p2p_heartbeat_total_count\n        trace.p2p_heartbeat_started_after_handoff = (\n            self._p2p_heartbeat_started_after_handoff\n        )\n        started = self._p2p_heartbeat_started_at\n        first = self._p2p_heartbeat_first_sent_at\n        trace.p2p_heartbeat_first_delay_seconds = (\n            round(max(0.0, first - started), 3)\n            if started is not None and first is not None\n            else None\n        )\n        task = self._p2p_heartbeat_task\n        trace.p2p_heartbeat_background_task_active = bool(\n            task is not None and not task.done()\n        )\n        if snapshot_pre_cmd13:\n            trace.p2p_heartbeat_pre_cmd13_count = self._p2p_heartbeat_total_count\n\n    async def _p2p_heartbeat_loop(self) -> None:\n        \"\"\"Maintain the adopted P2P lease until the Baichuan session closes.\"\"\"\n        try:\n            while self.connection_open:\n                await asyncio.sleep(P2P_HEARTBEAT_INTERVAL)\n                if not self.connection_open:\n                    break\n                try:\n                    self._record_p2p_heartbeat()\n                except (OSError, RuntimeError):\n                    break\n        except asyncio.CancelledError:\n            raise\n\n    def _start_p2p_heartbeat_loop(self) -> None:\n        \"\"\"Start one immediate heartbeat plus one background sender after handoff.\"\"\"\n        if not getattr(self, \"_handoff_active\", False):\n            return\n        if self._p2p_heartbeat_tid is None:\n            return\n        task = self._p2p_heartbeat_task\n        if task is not None and not task.done():\n            return\n        self._p2p_heartbeat_started_after_handoff = True\n        self._p2p_heartbeat_started_at = self._loop.time()\n        self._record_p2p_heartbeat()\n        self._p2p_heartbeat_task = self._loop.create_task(\n            self._p2p_heartbeat_loop()\n        )\n\n    async def _stop_p2p_heartbeat_loop(self) -> None:\n        task = self._p2p_heartbeat_task\n        self._p2p_heartbeat_task = None\n        if task is None or task is asyncio.current_task():\n            return\n        task.cancel()\n        try:\n            await task\n        except asyncio.CancelledError:\n            pass\n\n    async def connect(self):\n        \"\"\"Open/adopt the session and start heartbeat before login/FileInfo.\"\"\"\n        await super().connect()\n        self._start_p2p_heartbeat_loop()\n\n    async def close(self) -> None:\n        \"\"\"Stop the sole heartbeat sender before closing the adopted session.\"\"\"\n        await self._stop_p2p_heartbeat_loop()\n        await super().close()\n\n    async def send_file_download_probe(\n'''
          assert old_send_tail in beta20, "beta30 heartbeat send tail anchor not found"
          beta20 = beta20.replace(old_send_tail, new_send_tail, 1)

          old_started = '''        started_at = self._loop.time()\n        next_p2p_heartbeat_at = started_at\n        reason = \"\"\n        try:\n'''
          new_started = '''        started_at = self._loop.time()\n        reason = \"\"\n        self._apply_p2p_heartbeat_trace(trace, snapshot_pre_cmd13=True)\n        try:\n'''
          assert old_started in beta20, "beta30 cmd8 heartbeat start anchor not found"
          beta20 = beta20.replace(old_started, new_started, 1)

          old_loop = '''            while True:\n                now = self._loop.time()\n                if now >= next_p2p_heartbeat_at:\n                    trace.p2p_heartbeat_attempted = True\n                    if self._send_p2p_heartbeat():\n                        trace.p2p_heartbeat_count += 1\n                    next_p2p_heartbeat_at = now + P2P_HEARTBEAT_INTERVAL\n\n                if trace.expected_size_reached:\n'''
          new_loop = '''            while True:\n                if trace.expected_size_reached:\n'''
          assert old_loop in beta20, "beta30 per-cmd8 heartbeat loop anchor not found"
          beta20 = beta20.replace(old_loop, new_loop, 1)

          old_finally = '''            trace.connection_lost_exception_present = (\n                protocol.connection_lost_exception_present\n            )\n            if not trace.termination_reason:\n'''
          new_finally = '''            trace.connection_lost_exception_present = (\n                protocol.connection_lost_exception_present\n            )\n            self._apply_p2p_heartbeat_trace(trace)\n            if not trace.termination_reason:\n'''
          assert old_finally in beta20, "beta30 heartbeat final telemetry anchor not found"
          beta20 = beta20.replace(old_finally, new_finally, 1)
          beta20_path.write_text(beta20)

          diagnostics_path = Path("custom_components/reolink_battery/diagnostics.py")
          diagnostics = diagnostics_path.read_text()
          old_diag = '''                \"p2p_heartbeat_count\": stream.p2p_heartbeat_count,\n                \"p2p_heartbeat_interval_seconds\": stream.p2p_heartbeat_interval_seconds,\n                \"proactive_cmd234_count\": stream.proactive_cmd234_count,\n'''
          new_diag = '''                \"p2p_heartbeat_count\": stream.p2p_heartbeat_count,\n                \"p2p_heartbeat_interval_seconds\": stream.p2p_heartbeat_interval_seconds,\n                \"p2p_heartbeat_started_after_handoff\": (\n                    stream.p2p_heartbeat_started_after_handoff\n                ),\n                \"p2p_heartbeat_first_delay_seconds\": (\n                    stream.p2p_heartbeat_first_delay_seconds\n                ),\n                \"p2p_heartbeat_pre_cmd13_count\": (\n                    stream.p2p_heartbeat_pre_cmd13_count\n                ),\n                \"p2p_heartbeat_background_task_active\": (\n                    stream.p2p_heartbeat_background_task_active\n                ),\n                \"proactive_cmd234_count\": stream.proactive_cmd234_count,\n'''
          assert old_diag in diagnostics, "beta30 diagnostics heartbeat anchor not found"
          diagnostics = diagnostics.replace(old_diag, new_diag, 1)
          assert '"milestone": "3B.5-single-lease-handoff"' in diagnostics
          diagnostics = diagnostics.replace(
              '"milestone": "3B.5-single-lease-handoff"',
              '"milestone": "3B.6-continuous-p2p-heartbeat"',
              1,
          )
          diagnostics_path.write_text(diagnostics)

          manifest_path = Path("custom_components/reolink_battery/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          assert manifest["version"] == "0.1.2-beta.30"
          manifest["version"] = "0.1.2-beta.31"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          test_path = Path("tests/test_recording_download_beta20.py")
          tests = test_path.read_text()
          old_asserts = '''        self.assertEqual(trace.p2p_heartbeat_count, 0)\n        self.assertEqual(trace.p2p_heartbeat_interval_seconds, 1.0)\n        self.assertEqual(trace.aggregate_limit_bytes, 16 * 1024 * 1024)\n'''
          new_asserts = '''        self.assertEqual(trace.p2p_heartbeat_count, 0)\n        self.assertEqual(trace.p2p_heartbeat_interval_seconds, 1.0)\n        self.assertFalse(trace.p2p_heartbeat_started_after_handoff)\n        self.assertIsNone(trace.p2p_heartbeat_first_delay_seconds)\n        self.assertEqual(trace.p2p_heartbeat_pre_cmd13_count, 0)\n        self.assertFalse(trace.p2p_heartbeat_background_task_active)\n        self.assertEqual(trace.aggregate_limit_bytes, 16 * 1024 * 1024)\n'''
          assert old_asserts in tests, "beta30 beta20 trace test anchor not found"
          tests = tests.replace(old_asserts, new_asserts, 1)

          insert_before = '''\n\nif __name__ == \"__main__\":\n    unittest.main()\n'''
          helper_test = '''\n    def test_continuous_heartbeat_trace_captures_pre_cmd13_snapshot(self):\n        class _Task:\n            @staticmethod\n            def done():\n                return False\n\n        connection = object.__new__(probe._P2PHeartbeatFullTransferConnection)\n        connection._p2p_heartbeat_total_count = 5\n        connection._p2p_heartbeat_started_after_handoff = True\n        connection._p2p_heartbeat_started_at = 10.0\n        connection._p2p_heartbeat_first_sent_at = 10.125\n        connection._p2p_heartbeat_task = _Task()\n\n        trace = probe._new_trace(attempted=True)\n        connection._apply_p2p_heartbeat_trace(\n            trace, snapshot_pre_cmd13=True\n        )\n\n        self.assertTrue(trace.p2p_heartbeat_attempted)\n        self.assertEqual(trace.p2p_heartbeat_count, 5)\n        self.assertTrue(trace.p2p_heartbeat_started_after_handoff)\n        self.assertEqual(trace.p2p_heartbeat_first_delay_seconds, 0.125)\n        self.assertEqual(trace.p2p_heartbeat_pre_cmd13_count, 5)\n        self.assertTrue(trace.p2p_heartbeat_background_task_active)\n'''
          assert insert_before in tests, "beta20 test footer anchor not found"
          tests = tests.replace(insert_before, helper_test + insert_before, 1)
          test_path.write_text(tests)
          PY

      - name: Validate beta.31
        run: |
          python -m compileall -q custom_components/reolink_battery
          python tests/test_recording_download_beta20.py
          python tests/test_recording_download_probe.py
          if grep -q 'next_p2p_heartbeat_at' custom_components/reolink_battery/recording_download_probe_beta20.py; then
            echo 'per-cmd8 heartbeat sender still present'
            exit 1
          fi
          grep -q 'p2p_heartbeat_pre_cmd13_count' custom_components/reolink_battery/diagnostics.py
          grep -q '3B.6-continuous-p2p-heartbeat' custom_components/reolink_battery/diagnostics.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/reolink_battery/manifest.json').read_text())
          assert manifest['version'] == '0.1.2-beta.31'
          source = Path('custom_components/reolink_battery/recording_download_probe_beta20.py').read_text()
          assert 'async def _p2p_heartbeat_loop' in source
          assert 'self._start_p2p_heartbeat_loop()' in source
          assert 'await self._stop_p2p_heartbeat_loop()' in source
          PY

      - name: Commit beta.31 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/recording_download_probe_beta20.py \
                  custom_components/reolink_battery/diagnostics.py \
                  custom_components/reolink_battery/manifest.json \
                  tests/test_recording_download_beta20.py
          git diff --cached --quiet && { echo 'No beta.31 source changes staged'; exit 1; }
          git commit -m "Add continuous P2P heartbeat for beta.31"
          git push origin HEAD:feature/recording-worker-3b2

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.2-beta.31"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Milestone 3B.6 continuous P2P heartbeat on top of beta.30. The proven single-lease handoff remains unchanged. One C2D_HB sender now starts immediately after the discovery socket is adopted, before login and FileInfo, remains active through cmd14/15/16, cmd13 and cmd8, and stops before session close. The former cmd8-local heartbeat sender is removed so there is exactly one heartbeat source. Diagnostics expose whether heartbeat started after handoff, delay to the first heartbeat, heartbeat count before cmd13, total count and background-task state. cmd13/cmd8 framing, handle-bound full-high/mainStream transfer, atomic MP4 verification, queue, 60-second settle and HA Media event handoff are unchanged. No cmd9 is introduced."
