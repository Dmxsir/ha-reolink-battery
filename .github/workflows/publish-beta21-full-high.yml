name: Publish beta21 full-high probe

on:
  push:
    branches:
      - feature/recording-worker-3b2
    paths:
      - .github/workflows/publish-beta21-full-high.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recording-worker-3b2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire beta21 integration and diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          button = Path('custom_components/reolink_battery/button.py')
          text = button.read_text()
          text = text.replace('recording_download_probe_beta20', 'recording_download_probe_beta21')
          text = text.replace(
              'Probe cmd13/cmd8 full-transfer shape with same-session keepalive.',
              'Probe cmd13 prepare followed by handle-bound full-high cmd8.'
          )
          text = text.replace(
              'Find recording, run cmd13/cmd8 with keepalive, then close.',
              'Find recording, run cmd13 then full-high cmd8, then close.'
          )
          button.write_text(text)

          diag = Path('custom_components/reolink_battery/diagnostics.py')
          text = diag.read_text()
          text = text.replace('recording_download_probe_beta20', 'recording_download_probe_beta21')
          needle = '                "proactive_cmd234_count": stream.proactive_cmd234_count,\n'
          addition = (
              needle
              + '                "cmd8_full_high": stream.cmd8_full_high,\n'
              + '                "cmd8_handle_used": stream.cmd8_handle_used,\n'
              + '                "cmd8_forced_main_stream": stream.cmd8_forced_main_stream,\n'
              + '                "cmd8_full_high_body_length": stream.cmd8_full_high_body_length,\n'
              + '                "cmd8_layout": stream.cmd8_layout or None,\n'
          )
          if needle not in text:
              raise SystemExit('diagnostics insertion point not found')
          text = text.replace(needle, addition, 1)
          text = text.replace(
              '3B.2b-cmd8-p2p-heartbeat-full-transfer-probe',
              '3B.2b-cmd13-prepare-cmd8-full-high-probe'
          )
          diag.write_text(text)
          PY

      - name: Install protocol dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodomex==3.23.0 reolink-aio==0.21.8

      - name: Compile integration
        run: python -m compileall -q custom_components/reolink_battery

      - name: Run recording tests
        run: python -m unittest tests.test_recording_probe tests.test_recording_download_probe tests.test_recording_download_beta12

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/reolink_battery').rglob('*.json'):
              json.loads(path.read_text())
          PY

      - name: Commit beta21 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/reolink_battery/button.py custom_components/reolink_battery/diagnostics.py
          git diff --cached --quiet || git commit -m "Wire beta21 full-high cmd8 probe"
          git push origin HEAD:feature/recording-worker-3b2

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v0.1.2-beta.21
          git push -f origin v0.1.2-beta.21
          gh release delete v0.1.2-beta.21 --yes >/dev/null 2>&1 || true
          gh release create v0.1.2-beta.21 \
            --title "Reolink Battery v0.1.2-beta.21" \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --notes "Milestone 3B.2b main-stream discrimination probe. Keeps the physically validated cmd13 Id-only/no-Extension prepare request unchanged. After the accepted cmd13 XML arrives, beta.21 privately extracts its handle and only then builds cmd8 using the public full-high FileInfo shape: Id/fileName/name, returned handle, forced mainStream, fileType, recordType and start/end time. P2P transport/heartbeat and bounded in-memory assembly remain unchanged from beta.20. Diagnostics expose only booleans/layout/body lengths, never the handle or recording identity. No recording file, cmd9, automatic worker, queue removal, or Telegram."
