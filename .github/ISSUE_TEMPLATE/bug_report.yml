name: Bug report

description: Report a Live Feed or motion/recording problem with Reolink Battery.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Reolink Battery.

        Please reproduce the problem first, then download the **Home Assistant diagnostics** for this integration while the problem is still represented in the runtime state.

        The Reolink Battery diagnostics are designed to exclude passwords, account tokens, camera credentials, network addresses, recording filenames, session keys, and raw media.

        **Attach the complete downloaded diagnostics JSON file below.** The full file gives us more context and avoids missing useful information during troubleshooting.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which of the two main integration paths is affected?
      options:
        - Live Feed / video / audio
        - Motion notification / recording download
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics for issue
      description: |
        In Home Assistant open Settings → Devices & services → Reolink Battery → the integration entry → Download diagnostics.

        Reproduce the problem first, then **drag the complete downloaded diagnostics JSON file into this field**. GitHub will insert an attachment link.

        For recording problems, allow the normal recording-finalization/download workflow enough time to complete before taking diagnostics. If the worker appears stuck, take diagnostics while it is stuck.
      placeholder: Drag the complete Reolink Battery diagnostics JSON file here.
    validations:
      required: true

  - type: input
    id: occurred_at
    attributes:
      label: Approximate time of the problem
      description: Include date, local time, and timezone so timestamps can be correlated with diagnostics.
      placeholder: "2026-08-19 15:05 Asia/Jerusalem"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often / intermittent
        - Happened once
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: official_app
    attributes:
      label: Did the official Reolink app work at the same time?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: phone_notification
    attributes:
      label: Did the phone receive the Reolink motion notification?
      description: Select Not applicable for Live Feed problems.
      options:
        - "Yes"
        - "No"
        - Not sure
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you observed. For recording issues, include whether the notification arrived, whether the recording eventually appeared, and approximately how long you waited.
      placeholder: Tell us exactly what happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant log entries
      description: |
        Optional. Paste only log lines related to reolink_battery / reolink_aio around the failure.
        Remove passwords, tokens, public URLs, IP addresses, or other private data before posting.
      render: text
      placeholder: Optional relevant log entries

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, timing details, or anything else that may help.
      placeholder: Optional

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest available Reolink Battery version in HACS.
          required: true
        - label: I restarted Home Assistant after updating the integration.
          required: true
        - label: I reproduced the problem before downloading diagnostics.
          required: true
        - label: I attached the complete Reolink Battery diagnostics JSON file.
          required: true
        - label: I have not included passwords, tokens, camera credentials, or other secrets in logs or additional text.
          required: true
        - label: I searched existing issues and did not find the same problem already reported.
          required: true
