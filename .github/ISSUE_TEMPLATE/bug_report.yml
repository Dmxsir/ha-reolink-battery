name: Bug report

description: Report a Live Feed or motion/recording problem with Reolink Battery.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Reolink Battery.

        Please reproduce the problem first, then download the **Home Assistant diagnostics** for this integration while the problem is still represented in the runtime state.

        The diagnostics contain a small section prepared specifically for GitHub Issues. Copy only the section between:

        `### COPY FROM HERE FOR GITHUB ISSUE ###`

        and:

        `### END COPY FOR GITHUB ISSUE ###`

        **Do not paste passwords, account tokens, camera credentials, or unredacted private logs.**

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which of the two main integration paths is affected?
      options:
        - Live Feed / video / audio
        - Motion notification / recording download
    validations:
      required: true

  - type: input
    id: occurred_at
    attributes:
      label: Approximate time of the problem
      description: Include date, local time, and timezone so timestamps can be correlated with diagnostics.
      placeholder: "2026-08-19 15:05 Asia/Jerusalem"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often / intermittent
        - Happened once
        - Not sure
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.x.x
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Reolink Battery integration version
      placeholder: 1.3.x
    validations:
      required: true

  - type: input
    id: camera_model
    attributes:
      label: Camera model
      placeholder: Argus 2E
    validations:
      required: true

  - type: input
    id: camera_firmware
    attributes:
      label: Camera firmware version
      description: Optional, but useful for device-specific problems.
      placeholder: Optional

  - type: dropdown
    id: official_app
    attributes:
      label: Did the official Reolink app work at the same time?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: phone_notification
    attributes:
      label: Did the phone receive the Reolink motion notification?
      description: Select Not applicable for Live Feed problems.
      options:
        - "Yes"
        - "No"
        - Not sure
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed result. For recording issues, include whether the notification arrived and approximately how long you waited.
      placeholder: Tell us exactly what you observed.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
      placeholder: |
        1. Trigger motion / open Live Feed
        2. Wait ...
        3. Observe ...
        4. Download diagnostics ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics for issue
      description: |
        In Home Assistant open Settings → Devices & services → Reolink Battery → the integration entry → Download diagnostics.

        Open the downloaded JSON file and find:

        `### COPY FROM HERE FOR GITHUB ISSUE ###`

        Copy the complete block through:

        `### END COPY FOR GITHUB ISSUE ###`

        Paste only that block below. There is no need to upload or paste the full diagnostics file.
      render: json
      placeholder: Paste the marked diagnostics block here.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant log entries
      description: |
        Optional. Paste only log lines related to reolink_battery / reolink_aio around the failure.
        Remove passwords, tokens, public URLs, IP addresses, or other private data before posting.
      render: text
      placeholder: Optional relevant log entries

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, timing details, or anything else that may help.
      placeholder: Optional

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest available Reolink Battery version in HACS.
          required: true
        - label: I restarted Home Assistant after updating the integration.
          required: true
        - label: I reproduced the problem before downloading diagnostics.
          required: true
        - label: I pasted only the marked GitHub Issue diagnostics block, not the full diagnostics file.
          required: true
        - label: I have not included passwords, tokens, camera credentials, or other secrets.
          required: true
        - label: I searched existing issues and did not find the same problem already reported.
          required: true
